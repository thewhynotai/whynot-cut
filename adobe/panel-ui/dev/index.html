<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhyNot Cut panel - dev harness</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="panel.css">
<style>
  /* harness chrome only (not part of the panel) */
  html, body { margin: 0; height: auto; min-height: 100%; overflow: auto; background: #0c0c0c; color: #ddd; font: 12px/1.4 system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: #111; border-bottom: 1px solid #2a2a2a; }
  .grp { display: flex; align-items: center; margin: 2px 16px 2px 0; }
  .grp > span { margin-right: 6px; color: #8a8a8a; }
  .seg button { margin: 0; padding: 4px 10px; background: #1b1b1b; color: #ddd; border: 1px solid #333; cursor: pointer; font: inherit; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"] { background: #5400FB; border-color: #5400FB; color: #fff; }
  select, label { font: inherit; color: #ddd; }
  select { background: #1b1b1b; border: 1px solid #333; padding: 3px 6px; }
  .stage { display: flex; justify-content: center; padding: 16px; }
  /* the panel scrolls inside its own region (like a UXP dock): the frame is a fixed box, the page never scrolls it */
  .col { height: 640px; overflow: hidden; border: 1px solid #2a2a2a; background: #000000; }
  #root { height: 100%; }
  .calls { max-width: 560px; margin: 0 auto; padding: 0 16px 16px; color: #8a8a8a; font: 11px/1.5 Consolas, monospace; }
</style>
</head>
<body>
  <div class="bar">
    <div class="grp seg" id="lang"><span>Language</span><button data-v="en">EN</button><button data-v="ar">AR</button></div>
    <div class="grp seg" id="width"><span>Width</span><button data-v="280">280</button><button data-v="340">340</button><button data-v="480">480</button></div>
    <div class="grp seg" id="height"><span>Height</span><button data-v="470">470</button><button data-v="640">640</button><button data-v="900">900</button></div>
    <div class="grp"><span>State</span>
      <select id="scenario">
        <option value="showcase">All sections at once (visual QA)</option>
        <option value="approval">Waiting for approval</option>
        <option value="building">Build running</option>
        <option value="qc">QC frames</option>
        <option value="idle">Just started</option>
      </select>
    </div>
    <label class="grp"><input type="checkbox" id="progress"> Simulate build progress</label>
    <label class="grp"><input type="checkbox" id="offline"> Engine offline</label>
  </div>
  <div class="stage"><div class="col" id="col"><div id="root"></div></div></div>
  <div class="calls" id="calls">Host adapter calls appear here.</div>
  <script src="dev.js"></script>
</body>
</html>
