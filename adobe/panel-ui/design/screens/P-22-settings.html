<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="loading,normal,normal-live,advanced,formula,focus,saved,apikey,apikey-saved,error,offline,no-claude,support,support-live,support-empty,long">
<meta name="mock-keys" content="Cmd/Ctrl+,: open Settings from anywhere in the panel; Tab order follows the page top to bottom (language, Change, start-up, AI choice, Advanced settings, Models, tool rows, Export my week, Details for support, Copy details and open WhatsApp, Open guide); Space: tick a box or pick a choice; the name is locked (read-only); Cmd/Ctrl+Enter: the violet fix of a card on top; Esc: back to Home (or closes Details for support when it is open)">
<meta name="mock-motion" content="Saved: the green check and word fade in 150 ms next to the control, stay 2 s, fade out 200 ms (the space is reserved, nothing moves); radio dot and check box fill 150 ms ease; Details for support opens with a 200 ms fade below its row (the one height change on this page, at the bottom; static fallback: instant); skeleton shimmer 1200 ms linear (static fallback: flat bars). No primary fill on this page.">
<title>P-22 Settings</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/premiere-core.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/premiere-core.js"></script>
<script src="../mockup.js"></script>
<script src="../js/premiere-core.js"></script>
</head>
>
<body>
<script>
/* P-22 Settings (screen-inventory.md §3 P-22; Addendum G2; G2-r1 owner decision e; R2 fix list). Opens from the Settings row on
   Home (Home tab stays selected).
   - No primary: each control saves at once and says "Saved." beside it.
   - Sections: your name (R2 G-F-05: locked after first setup, with a "Changed by" log line) · language · clients folder ·
     sign-off (R2: "Confirmed with" is required for medical and religious clients, set by the agency) · start-up · Claude
     and AI buttons (R2 E-P1-05: editors see ONE default; the other two modes live under the collapsed "Advanced settings
     (for the owner)") · Models · tool defaults · Export my week (G-F-07 / G-F-17) · time saved estimate (R2 G-F-15: read-only
     "Set by your agency"; the editable rate is only in the owner's Advanced section; "How is this worked out?" lists one
     formula per job type) · privacy (the approved Claude fact, no telemetry, trains on nothing) · about · Details for support.
   - Advanced (owner): the two other Claude modes, the editable rate, the sign-off requirement (on by default), and under
     "Advanced, not recommended" the backup switch (R2 G-F-12: client projects always keep a backup).
   - Details for support is the only place the log appears (G7), in plain words (R2 D-P1-10: no heartbeat, request ids or
     FAILED lines); ONE support action (R2 G-F-09, D-05): live = "Copy details and open support" (one click) + "We reply
     within one working day (Sun–Thu, Cairo time)."; not live (the default, H24) = "Copy details for support", which only
     copies, with the plain-text "Support page coming soon" beside it. Live states: normal-live, support-live.
     R3: Support (D-05 update 2026-10-16, R3-fix-list S-01): the WhatsApp chat is live, so the support action is "Copy details and open WhatsApp" + the reply promise by default; ?support=off draws the copy-only alternate. "-live" now draws the guide and "Cost and data" live.
   - D-01 (cost): under the AI choice, "Each editor needs their own Claude Pro or Max plan, paid to Anthropic ..." and "See
     plans" (support.claude.com, live); the API-key mode (Advanced, owner) says "Paid per use to Anthropic. Not needed if
     you have Pro or Max" and is never the default. D-02 + D-03: the privacy section carries the approved privacy line, the
     data line, and "Cost and data" (thewhynot.ai/data) ONLY when live; not live, the data line stands alone.
   - H24: "Open guide" (thewhynot.ai/help) is the same: live states only; not live, the plain line "Guide coming soon".
   - apikey / apikey-saved: the key field; a saved key is never shown again. no-claude: the AI section's Claude card.
   - offline: everything that needs the service is disabled; language still works.
   - error: one control failed; its card sits under it with Try again. Empty and stale: not applicable. */
(function () {
  var t = M.t, D = M.D, P = PC.D;

  function saved(text) { return '<div class="pc-saved">' + M.status("ok", 12) + '<span class="t-meta tx-ok ms-1">' + (text || t("p22.saved")) + "</span></div>"; }
  function sec(eyebrow, inner) { return M.eyebrow(eyebrow, "mt-5") + M.card(inner, "mt-2"); }
  /* a read-only value: a locked inset */
  function locked(valueHtml) {
    return '<div class="m-inset"><div class="m-row">' + M.ico("lock", 16, "ink-muted") + '<span class="t-body ms-2 m-grow">' + valueHtml + "</span></div></div>";
  }
  function name() {
    return sec(t("p22.name"), locked(M.txt(D.editor)) +
      '<div class="t-meta tx-muted mt-2">' + t("p22.name_hint") + "</div>" +
      '<div class="t-meta tx-muted mt-1">' + t("p22.name_log", { who: D.editor, when: M.raw("p22.demo.when") }) + "</div>" +
      '<div class="mt-3">' + M.trust(t("p22.signoff.line")) + "</div>");
  }
  function lang(o) {
    o = o || {};
    var ar = '<span class="ar-run">العربية</span>', en = M.ltr("English", "lat");
    return sec(t("p22.lang"), M.segmented([ar, en], M.lang === "ar" ? 0 : 1) +
      (o.saved ? saved() : ""));
  }
  function clients(o) {
    o = o || {};
    return sec(t("p22.clients"), '<div class="m-row-top">' + M.ico("folder", 16, "ink-muted") + '<div class="t-body ms-2 m-grow">' +
      t("p22.clients.sub", { name: M.html(M.ltr(P.rootName, "lat tx-text")) }) + "</div></div>" +
      PC.acts([M.btn(t("p22.change"), { icon: "folder-open", disabled: o.disabled, focus: o.focus })]));
  }
  function start(o) {
    o = o || {};
    return sec(t("p22.start"), PC.checkbox(t("p22.engine"), true, { disabled: o.disabled }) + '<div class="t-meta tx-muted mt-1">' + t("p22.engine_hint") + "</div>" +
      (o.error ? '<div class="mt-3">' + M.notice("error", t("p22.failed"), { sub: t("p22.failed.sub"), btn: { label: t("action.retry"), icon: "refresh-cw", primary: true } }) + "</div>" : ""));
  }
  /* editors see ONE default mode (the open Claude session); the cost line is D-01, verbatim, with "See plans" */
  function ai(o) {
    o = o || {};
    var sel = o.sel || "session", dis = o.disabled;
    return sec(t("p22.ai"),
      (o.noClaude ? M.noClaude("signed_out", { primary: true }) + '<div class="mt-3"></div>' : "") +
      M.radio(t("p22.ai.session"), sel === "session", { sub: t("p22.ai.session.sub"), disabled: dis }) +
      '<span class="m-divider mt-2"></span><div class="t-meta tx-muted mt-2">' + t("claude.cost") + "</div>" + M.plansLink());
  }
  /* the owner's section: collapsed for editors. o = {open, sel, keySaved, disabled} */
  function advanced(o) {
    o = o || {};
    if (!o.open) return M.card(M.sechead(t("p22.adv"), "", false), "m-card-flush mt-4");
    var sel = o.sel || "session", dis = o.disabled;
    var key = "";
    if (sel === "key") {
      key = '<div class="m-col mt-2">' + (o.keySaved
        ? '<div class="m-row">' + M.chip("ok", t("p22.key.saved"), "key-round") + "</div>" + PC.acts([M.btn(t("p22.key.replace"), { icon: "key-round" })])
        : M.input(t("p22.key.placeholder"), { focus: true }) + '<div class="t-meta tx-muted mt-2">' + t("p22.key.hint") + "</div>" +
          PC.acts([PC.kbtn(t("p22.key.save"), "↵", { icon: "key-round" })])) + "</div>";
    }
    return M.card(M.sechead(t("p22.adv"), "", true) + '<div class="t-meta tx-muted mt-1">' + t("p22.adv.hint") + "</div>" +
      '<div class="mt-3"></div>' +
      M.radio(t("p22.ai.cli"), false, { sub: t("p22.ai.cli.sub"), disabled: dis }) + '<div class="mt-1"></div>' +
      M.radio(t("p22.ai.key"), sel === "key", { sub: t("p22.ai.key.sub"), disabled: dis }) + key +
      '<span class="m-divider mt-3"></span>' +
      '<div class="t-label mt-3">' + t("p22.rate.owner") + "</div>" +
      '<div class="m-row mt-2"><div style="width:96px">' + M.input("", { value: M.ltr(String(P.rate), "lat") }) + "</div></div>" +
      '<div class="mt-3">' + PC.checkbox(t("p22.signoff.req"), true, { disabled: dis }) + "</div>" +
      '<div class="t-meta tx-muted mt-1">' + t("p22.signoff.req.hint") + "</div>" +
      '<span class="m-divider mt-3"></span>' +
      '<div class="t-label mt-3">' + t("p22.adv.risky") + "</div>" +
      '<div class="mt-1">' + PC.checkbox(t("p22.backup"), true, { disabled: dis }) + "</div>" +
      '<div class="t-meta tx-muted mt-1">' + t("p22.backup.hint") + "</div>", "mt-4");
  }
  function li(icon, label, sub, dis) {
    var ink = dis ? "ink-disabled" : "ink-muted";
    return '<div class="m-li" role="button"' + (dis ? ' aria-disabled="true" tabindex="-1"' : ' tabindex="0"') + ">" + M.ico(icon, 16, ink) +
      '<div class="m-col ms-2 m-grow"><div class="t-label' + (dis ? " tx-disabled" : "") + '">' + label + "</div>" + (sub ? '<div class="t-meta tx-muted">' + sub + "</div>" : "") + "</div>" +
      '<div class="ms-2">' + M.chev(ink) + "</div></div>";
  }
  /* the time-saved rate is read-only here (R2 G-F-15) and every formula is shown (R2 G-F-03) */
  function rate(o) {
    o = o || {};
    var f = function (k) { return '<div class="t-meta tx-muted mt-1">' + t(k) + "</div>"; };
    return sec(t("p22.rate"), '<div class="t-label">' + t("p22.rate.label") + "</div>" +
      '<div class="m-row mt-2"><div class="m-inset m-row">' + M.ico("lock", 16, "ink-muted") + '<span class="t-body ms-2">' + M.ltr(String(P.rate), "lat") + "</span></div>" +
        '<span class="ms-2"></span>' + M.chip("neutral", t("p22.rate.agency"), "lock") + "</div>" +
      '<div class="t-meta tx-muted mt-2">' + t("p22.rate.hint") + "</div>" +
      '<div class="mt-2">' + M.sechead(t("p22.how"), "", !!o.formula) + "</div>" +
      (o.formula ? f("p22.f.reel") + f("p22.f.hush") + f("p22.f.tidy") + f("p22.f.captions") + f("p22.f.cap") : ""));
  }
  function privacy() {
    var line = function (h, i) { return PC.iconrow(M.ico("circle-check", 16, "ink-ok"), h, i ? "mt-2" : ""); };
    /* R3 decision 2 (owner N-01): the green ticks speak only for WhyNot Cut ("trains on nothing"); the D-02 line about what
       Claude reads keeps the neutral info icon, never a tick */
    /* D-03 line, no telemetry, trains on nothing, then the D-02 data line; "Cost and data" only when live (H24) */
    return sec(t("p22.privacy"), '<div class="m-col">' + line(t("p22.privacy.fact"), 0) + line(t("p22.privacy.telemetry"), 1) + line(t("p22.privacy.training"), 2) +
      PC.iconrow(M.ico("info", 16, "ink-muted"), t("claude.data"), "mt-2") + "</div>" + M.dataLink());
  }
  function supportCard(open, lines) {
    var toggle = '<div class="m-li" role="button" tabindex="0" aria-expanded="' + !!open + '">' + M.ico("scroll-text", 16, "ink-muted") +
      '<div class="t-label ms-2 m-grow">' + (open ? t("p22.support.hide") : t("p22.support.show", { n: P.log.length })) + "</div>" +
      /* keycap and chevron side by side (the keycap first, as on buttons) */
      '<div class="m-row ms-2">' + (open ? PC.key("Esc") : "") + '<span class="ms-2">' + M.ico(open ? "chevron-up" : "chevron-down", 16, "ink-muted") + "</span></div></div>";
    /* D-05 update (2026-10-16): support.url is the WhatsApp chat (live by default, M.supportLive); the details are
       copied first and never put in the link. ?support=off: the button only copies */
    var where = M.supportLive ? t("p22.support.opens") : t("p22.support.copyonly");
    return sec(t("p22.support"), '<div class="t-meta tx-muted">' + t("p22.support.sub") + "</div>" +
      '<div class="t-meta tx-muted mt-1">' + where + "</div>" +
      '<div class="m-col mt-2">' + toggle + "</div>" +
      (open ? '<div class="mt-2">' + M.logline(lines) + "</div>" : "") +
      '<div class="mt-2">' + M.supportRow({ kind: "secondary", promise: true }) + "</div>" +
      /* H24: "Open guide" opens thewhynot.ai/help (MOCK_DATA.support.guide_url), not published yet: not live = the plain line */
      (M.live ? PC.acts([M.btn(t("p22.guide"), { kind: "ghost", icon: "life-buoy", flush: true })]) : M.soonLine("guide.soon", "mt-3")) +
      '<div class="t-meta tx-muted mt-3">' + M.ltr("WhyNot Cut " + P.version, "lat") + "</div>");
  }
  function more(o) {
    o = o || {};
    var dis = o.disabled;
    return M.card(li("cpu", t("p22.models"), t("p22.models.sub", { n: 3, of: 5 }), dis) + li("file-text", t("p22.export"), t("p22.export.sub"), dis) +
        (o.saved ? '<div class="mt-1">' + saved(t("p22.export.done")) + "</div>" : ""), "m-card-flush mt-5") +
      M.eyebrow(t("p22.tools"), "mt-5") +
      M.card(li("folder-tree", t("home.tool.tidy"), M.ltr("Tidy"), dis) + li("audio-waveform", t("home.tool.hush"), M.ltr("Hush"), dis) +
        li("captions", t("home.tool.kalam"), M.ltr("Kalam"), dis), "m-card-flush mt-2") +
      rate(o) + privacy() +
      supportCard(o.support, o.lines);
  }
  function top() { return M.back(t("p22.back")) + PC.title(t("p22.title")); }
  function page(o) { o = o || {}; return top() + name() + lang(o) + clients(o) + start(o) + ai(o) + advanced(o) + more(o); }
  function skelSec() { return '<div class="mt-5">' + M.skel(25, 16) + "</div>" + M.card(M.skel(40) + '<div class="mt-2"><span class="m-skel-block" style="height:32px;display:block"></span></div>' + M.skel(55, 16), "mt-2"); }

  var STATES = {
    loading: function () { return { body: top() + skelSec() + skelSec() + skelSec() }; },
    normal: function () { return { body: page() }; },
    advanced: function () { return { body: top() + ai() + advanced({ open: true }) }; },
    formula: function () { return { body: top() + rate({ formula: true }) }; },
    focus: function () { return { body: page({ focus: true }) }; },
    saved: function () { return { body: page({ saved: true }) }; },
    apikey: function () { return { body: top() + ai({ sel: "key" }) + advanced({ open: true, sel: "key" }) + start() }; },
    "apikey-saved": function () { return { body: top() + ai({ sel: "key" }) + advanced({ open: true, sel: "key", keySaved: true }) + start() }; },
    error: function () { return { body: top() + start({ error: true }) + name() + lang() + clients() + ai() + advanced() + more() }; },
    offline: function () {
      return { pills: { engine: "off", claude: "unchecked", host: "unlinked" },
        body: M.offline({ hintKey: "p22.offline_hint", support: false }) + '<div class="mt-4"></div>' + page({ disabled: true }) };
    },
    "no-claude": function () {
      return { pills: { claude: "signed_out" }, body: top() + ai({ noClaude: true }) + privacy() + name() + lang() };
    },
    support: function () { return { body: top() + supportCard(true, P.log) + name() + lang() }; },
    /* "-live" states reach these builders under their base name; M.live decides what the support card and the privacy card show */
    "support-empty": function () { return { body: top() + supportCard(true, []) + name() + lang() }; },
    long: function () { return { body: page({ saved: true }) }; }
  };

  PC.mount({
    id: "P-22", name: "Settings",
    states: ["loading", "normal", "normal-live", "advanced", "formula", "focus", "saved", "apikey", "apikey-saved", "error", "offline", "no-claude", "support", "support-live", "support-empty", "long"], defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "home";
      if (v.needs === undefined) v.needs = 0;
      return v;
    }
  });
})();
</script>
</body>
</html>
