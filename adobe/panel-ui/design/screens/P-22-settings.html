<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="loading,normal,focus,saved,apikey,error,offline,no-claude,support,support-empty,long">
<meta name="mock-keys" content="Cmd/Ctrl+,: open Settings from anywhere in the panel; Tab order follows the page top to bottom (name, language, Change, start-up, AI choice, Models, tool rows, Details for support, Contact support, Open guide); Space: tick a box or pick a choice; Enter in the name field saves it; Cmd/Ctrl+Enter: the violet fix of a card on top; Esc: back to Home (or closes Details for support when it is open)">
<meta name="mock-motion" content="Saved: the green check and word fade in 150 ms next to the control, stay 2 s, fade out 200 ms (the space is reserved, nothing moves); radio dot and check box fill 150 ms ease; Details for support opens with a 200 ms fade below its row (the one height change on this page, at the bottom; static fallback: instant); skeleton shimmer 1200 ms linear (static fallback: flat bars). No primary fill on this page.">
<title>P-22 Settings</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/premiere-core.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/premiere-core.js"></script>
<script src="../mockup.js"></script>
<script src="../js/premiere-core.js"></script>
</head>
<body>
<script>
/* P-22 Settings (screen-inventory.md §3 P-22; Addendum G2; G2-r1 owner decision e). Opens from the Settings row on
   Home (Home tab stays selected).
   - No primary: each control saves at once and says "Saved." beside it.
   - Sections: your name · language · clients folder (folder NAME, no drive path) · start-up (the service at sign-in)
     · Claude and AI buttons · Models (moved here from Home) · tool defaults · time saved estimate (the editable
     time_saved_rate, eng-data-contract §7.3) · privacy (the approved Claude fact, no telemetry, trains on nothing)
     · about · Details for support (Contact support opens https://thewhynot.ai/support; details are never attached).
   - Details for support is the only place the log appears (G7 open = support, open and empty = support-empty),
     with Contact support (opens the configured support link) and Copy details.
   - apikey: the key field; a saved key is never shown again. no-claude: the AI section's Claude card.
   - offline: everything that needs the service is disabled; name and language still work.
   - error: one control failed; its card sits under it with Try again. Empty and stale: not applicable. */
(function () {
  var t = M.t, D = M.D, P = PC.D;

  function saved() { return '<div class="pc-saved">' + M.status("ok", 12) + '<span class="t-meta tx-ok ms-1">' + t("p22.saved") + "</span></div>"; }
  function sec(eyebrow, inner) { return M.eyebrow(eyebrow, "mt-5") + M.card(inner, "mt-2"); }
  function name(o) {
    o = o || {};
    return sec(t("p22.name"), '<div>' + M.input(t("approval.editor.placeholder"), { value: M.txt(D.editor), focus: o.focus }) + "</div>" +
      '<div class="t-meta tx-muted mt-2">' + t("p22.name_hint") + "</div>" + (o.saved ? saved() : ""));
  }
  function lang(o) {
    o = o || {};
    var ar = '<span class="ar-run">العربية</span>', en = M.ltr("English", "lat");
    return sec(t("p22.lang"), PC.radio(ar, null, M.lang === "ar") + '<div class="mt-1"></div>' + PC.radio(en, null, M.lang === "en") +
      '<div class="t-meta tx-muted mt-2">' + t("p22.lang_hint") + "</div>" + (o.saved ? saved() : ""));
  }
  function clients(o) {
    o = o || {};
    return sec(t("p22.clients"), '<div class="m-row-top">' + M.ico("folder", 16, "ink-muted") + '<div class="t-body ms-2 m-grow">' +
      t("p22.clients.sub", { name: M.html(M.ltr(P.rootName, "lat tx-text")) }) + "</div></div>" +
      PC.acts([M.btn(t("p22.change"), { icon: "folder-open", disabled: o.disabled })]));
  }
  function start(o) {
    o = o || {};
    var box = M.checkbox(t("p22.engine"), true, false);
    if (o.disabled) box = box.replace('class="m-checkrow"', 'class="m-checkrow pc-radio-disabled" aria-disabled="true"').replace('t-label ms-2 m-grow', 't-label ms-2 m-grow tx-disabled');
    return sec(t("p22.start"), box + '<div class="t-meta tx-muted mt-1">' + t("p22.engine_hint") + "</div>" +
      (o.error ? '<div class="mt-3">' + PC.notice("error", t("p22.failed"), { sub: t("p22.failed.sub"), btn: { label: t("action.retry"), icon: "refresh-cw" } }) + "</div>" : ""));
  }
  function ai(o) {
    o = o || {};
    var sel = o.sel || "session", dis = o.disabled;
    var key = "";
    if (sel === "key") {
      key = '<div class="m-col mt-2">' + (o.keySaved
        ? '<div class="m-row">' + M.chip("ok", t("p22.key.saved"), "key-round") + "</div>" + PC.acts([M.btn(t("p22.key.replace"), { icon: "key-round" })])
        : M.input(t("p22.key.placeholder"), { focus: true }) + '<div class="t-meta tx-muted mt-2">' + t("p22.key.hint") + "</div>" +
          PC.acts([PC.kbtn(t("p22.key.save"), "↵", { icon: "key-round" })])) + "</div>";
    }
    return sec(t("p22.ai"),
      (o.noClaude ? PC.noClaude({ primary: false }) + '<div class="mt-3"></div>' : "") +
      PC.radio(t("p22.ai.session"), t("p22.ai.session.sub"), sel === "session", { disabled: dis }) + '<div class="mt-1"></div>' +
      PC.radio(t("p22.ai.key"), t("p22.ai.key.sub"), sel === "key", { disabled: dis }) + key + '<div class="mt-1"></div>' +
      PC.radio(t("p22.ai.cli"), t("p22.ai.cli.sub"), false, { disabled: dis }));
  }
  function li(icon, label, sub, dis) {
    var ink = dis ? "ink-disabled" : "ink-muted";
    return '<div class="m-li" role="button"' + (dis ? ' aria-disabled="true" tabindex="-1"' : ' tabindex="0"') + ">" + M.ico(icon, 16, ink) +
      '<div class="m-col ms-2 m-grow"><div class="t-label' + (dis ? " tx-disabled" : "") + '">' + label + "</div>" + (sub ? '<div class="t-meta tx-muted">' + sub + "</div>" : "") + "</div>" +
      '<div class="ms-2">' + M.chev(ink) + "</div></div>";
  }
  /* the time-saved rate (eng-data-contract §7.3: preference time_saved_rate, default 9, labelled "estimate") */
  function rate(o) {
    o = o || {};
    return sec(t("p22.rate"), '<div class="t-label">' + t("p22.rate.label") + "</div>" +
      '<div class="m-row mt-2"><div style="width:96px">' + M.input("", { value: M.ltr(String(P.rate), "lat"), focus: o.focusRate }) + "</div>" +
        '<span class="ms-2"></span>' + M.btn(t("p22.rate.reset"), { kind: "ghost", disabled: true }) + "</div>" +
      '<div class="t-meta tx-muted mt-2">' + t("p22.rate.hint") + "</div>" + (o.saved ? saved() : ""));
  }
  function privacy() {
    var line = function (h, icon) { return '<div class="pc-bullet">' + M.ico(icon, 16, "ink-ok") + '<div class="t-body ms-2 m-grow">' + h + "</div></div>"; };
    return sec(t("p22.privacy"), '<div class="m-col">' + line(t("p22.privacy.fact"), "circle-check").replace("pc-bullet", "pc-bullet pc-first") +
      line(t("p22.privacy.telemetry"), "circle-check") + line(t("p22.privacy.training"), "circle-check") + "</div>");
  }
  function supportCard(open, lines) {
    var n = lines ? lines.length : 0;
    var toggle = '<div class="m-li" role="button" tabindex="0" aria-expanded="' + !!open + '">' + M.ico("scroll-text", 16, "ink-muted") +
      '<div class="t-label ms-2 m-grow">' + (open ? t("p22.support.hide") : t("p22.support.show", { n: P.log.length })) + "</div>" +
      /* keycap and chevron side by side (the keycap first, as on buttons) */
      '<div class="m-row ms-2">' + (open ? PC.key("Esc") : "") + '<span class="ms-2">' + M.ico(open ? "chevron-up" : "chevron-down", 16, "ink-muted") + "</span></div></div>";
    return sec(t("p22.support"), '<div class="t-meta tx-muted">' + t("p22.support.sub") + "</div>" +
      '<div class="t-meta tx-muted mt-1">' + t("p22.support.opens", { url: M.html(M.ltr(P.links.support.replace("https://", ""), "lat")) }) + "</div>" +
      '<div class="m-col mt-2">' + toggle + "</div>" +
      (open ? '<div class="mt-2">' + PC.logBody(lines) + "</div>" : "") +
      PC.acts([M.btn(t("action.support"), { icon: "headset" })].concat(open && n ? [M.btn(t("p22.support.copy"), { kind: "ghost", icon: "copy" })] : [])));
  }
  function more(o) {
    o = o || {};
    var dis = o.disabled;
    return M.card(li("cpu", t("p22.models"), t("p22.models.sub", { n: 3, of: 5 }), dis), "m-card-flush mt-5") +
      M.eyebrow(t("p22.tools"), "mt-5") +
      M.card(li("folder-tree", t("home.tool.tidy"), M.ltr("Tidy"), dis) + li("audio-waveform", t("home.tool.hush"), M.ltr("Hush"), dis) +
        li("captions", t("home.tool.kalam"), M.ltr("Kalam"), dis), "m-card-flush mt-2") +
      rate(o) + privacy() +
      sec(t("p22.about"), '<div class="t-body">' + M.ltr("WhyNot Cut " + P.version, "lat") + "</div>" +
        PC.acts([M.btn(t("p22.guide"), { kind: "ghost", icon: "life-buoy", flush: true })])) +
      supportCard(o.support, o.lines);
  }
  function top() { return PC.back(t("p22.back")) + PC.title(t("p22.title")); }
  function page(o) { o = o || {}; return top() + name(o) + lang(o) + clients(o) + start(o) + ai(o) + more(o); }
  function skelSec() { return '<div class="mt-5">' + M.skel(25, 16) + "</div>" + M.card(M.skel(40) + '<div class="mt-2"><span class="m-skel-block" style="height:32px;display:block"></span></div>' + M.skel(55, 16), "mt-2"); }

  var STATES = {
    loading: function () { return { body: top() + skelSec() + skelSec() + skelSec() }; },
    normal: function () { return { body: page() }; },
    focus: function () { return { body: page({ focus: true }) }; },
    saved: function () { return { body: page({ saved: true }) }; },
    apikey: function () { return { body: top() + ai({ sel: "key" }) + ai({ sel: "key", keySaved: true }) + start() }; },
    error: function () { return { body: top() + start({ error: true }) + name() + lang() + clients() + ai() + more() }; },
    offline: function () {
      return { pills: { engine: "off", claude: "unchecked", host: "unlinked" },
        body: PC.notice("error", t("engine.off"), { sub: t("p22.offline_hint"), btn: { label: t("action.start_app"), icon: "power", primary: true }, dismiss: false }) +
          '<div class="mt-4"></div>' + page({ disabled: true }) };
    },
    "no-claude": function () {
      return { pillx: { claude: ["warn", t("p02.pill.not_open")] }, body: top() + ai({ noClaude: true }) + privacy() + name() + lang() };
    },
    support: function () { return { body: top() + supportCard(true, P.log) + name() + lang() }; },
    "support-empty": function () { return { body: top() + supportCard(true, []) + name() + lang() }; },
    long: function () { return { body: page({ saved: true }) }; }
  };

  PC.mount({
    id: "P-22", name: "Settings",
    states: ["loading", "normal", "focus", "saved", "apikey", "error", "offline", "no-claude", "support", "support-empty", "long"], defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "home";
      if (v.needs === undefined) v.needs = 0;
      return v;
    }
  });
})();
</script>
</body>
</html>
