<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="empty,loading,normal,running-early,focus,waiting,failed,offline,no-claude,no-internet,stale,done,long">
<meta name="mock-keys" content="Cmd/Ctrl+Enter: the violet button (Review and approve / Try again / Open project / Open Claude / Make my edit); Cmd/Ctrl+.: Cancel the running step (asks nothing: the steps before it are kept); Esc: dismiss a card; Tab order: card fix, Cancel, then the done card's buttons. The step list is plain text (not focusable).">
<meta name="mock-motion" content="Progress fill width 250 ms ease per update (static fallback: width jumps); the running segment and the running step icon: loader rotates 900 ms linear (static fallback: still loader); indeterminate bar: shimmer band moves 1200 ms linear (static fallback: the band sits in the middle); a step turning done: icon colour 200 ms; the done card fades in 200 ms into the slot of the progress card (same top edge, no jump). Never animates height.">
<title>P-06 Pipeline progress</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/premiere-core.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/premiere-core.js"></script>
<script src="../mockup.js"></script>
<script src="../js/premiere-core.js"></script>
</head>
>
<body>
<script>
/* P-06 Pipeline progress (+ done) (screen-inventory.md §3 P-06; direction §12; Addendum G2; R2 fix list). Edit tab.
   - Strip, then the current step's card: sentence with "23 of 47" at the end, the 4 px bar, elapsed + Cancel.
   - R2 E-P1-02: while the sequence builds the card says what is safe (work in any other sequence, don't open the new
     one) and, under Cancel, what Cancel does (stops the build, removes the unfinished sequence, keeps plan + approval).
   - R2 E-P2-10: the steps are "Export frames", "Quality check", "Ready for you" (no two steps sound the same).
   - R2 D-P1-2: work stopped by a problem is never drawn as running: offline = "Paused at 23 of 47, resumes when the
     service is back" with an amber pause icon, a solid amber bar, no spinner, and no "Claude is working" line.
     no-claude (Claude signed out) and no-internet (new, E-P1-03) pause the plan the same way.
   - Steps card: the seven steps (M.stages) as plain text with state and time; waiting = the pink Needs-you dot.
   - waiting: Review and approve (primary). failed: what + why + Try again (one button).
   - done: the handoff card with the time saved (6:40 raw, 52 s reel, about 45 min, estimate), the trust line, Verified /
     Not verified / Needs you, Open project (primary) with one line saying it opens next to your work. */
(function () {
  var t = M.t, D = M.D, P = PC.D;
  function code(s) { return PC.code(s); }
  var KEYS = ["transcript", "plan", "approve", "build", "frames", "qc", "handoff"];
  var KIND = { done: "ok", run: "busy", wait: "waiting", fail: "error", pend: "pending", pause: "paused" };
  var ST = { done: "p06.st.done", run: "p06.st.running", wait: "p06.st.waiting", fail: "p06.st.failed", pend: "p06.st.pending", pause: "p06.st.paused" };
  var TIMES = ["0:41", "1:05", "0:20", "", "", "", ""];

  function head(states, cur, kind) {
    /* a paused step has no strip segment of its own: it stays unlit and the status icon says "paused" */
    return M.steps(states.map(function (s) { return s === "pause" ? "pend" : s; }), cur, kind) + '<div class="t-title mt-4">' + t("p06.title", { item: code(D.item) }) + "</div>";
  }
  function stepList(states) {
    var rows = states.map(function (s, i) {
      return [KIND[s], t("step." + KEYS[i]), s === "done" && TIMES[i] ? M.mono(TIMES[i]) : "", t(ST[s])];
    });
    return M.eyebrow(t("p06.steps"), "mt-5") + M.card(M.stages(rows), "m-card-flush mt-2");
  }
  /* the current step's card. o = {text, sub, pct, indet, noBar, paused, time, cancelOff, cancelNote, focus, info} */
  function current(o) {
    o = o || {};
    var bar = o.noBar ? "" : o.indet ? '<div class="mt-3">' + PC.indet() + "</div>" : '<div class="mt-3">' + M.progress(o.pct || 49, { paused: o.paused }).replace('m-fill-paused" style="', 'm-fill-paused" style="background:var(--twn-warn);') + "</div>";
    var cancel = PC.kbtn(t("p06.cancel"), "mod+.", { kind: "ghost", icon: "circle-stop", disabled: o.cancelOff, focus: o.focus });
    var text = o.paused ? '<div class="m-row-top">' + M.status("paused") + '<div class="t-body ms-2 m-grow">' + o.text + "</div></div>" : '<div class="t-body">' + o.text + "</div>";
    return M.card(
      text + (o.sub ? '<div class="t-meta tx-muted mt-1">' + o.sub + "</div>" : "") + bar +
      '<div class="pc-meta-row mt-2">' + M.ico("clock", 12, "ink-muted") + '<span class="t-meta tx-muted ms-1 m-grow">' + t("p06.elapsed", { t: M.html(M.mono(o.time || "3:12")) }) + "</span>" + cancel + "</div>" +
      (o.cancelOff ? '<div class="t-meta tx-muted mt-1">' + t("p06.cancel_off") + "</div>" : "") +
      (o.cancelNote ? '<div class="t-meta tx-muted mt-1">' + t("p06.cancel_note") + "</div>" : "") +
      (o.info ? '<div class="mt-3">' + PC.info(o.info) + "</div>" : ""), "mt-4");
  }
  var RUN = ["done", "done", "done", "run", "pend", "pend", "pend"];
  function building(o) {
    o = o || {};
    o.text = t("p06.building", { n: 23, of: 47 });
    o.sub = t("p06.build_safe", { seq: M.html(M.path(P.sequence)) });
    o.cancelNote = true;
    return current(o);
  }
  function slot(n) { return n + '<div class="mt-4"></div>'; }
  function list(icon, items) { return items.map(function (h, i) { return PC.iconrow(icon, h, i ? "mt-2" : "mt-1"); }).join(""); }

  var STATES = {
    empty: function () {
      return { body: M.steps(["pend", "pend", "pend", "pend", "pend", "pend", "pend"], 0, "pending") + '<div class="mt-4"></div>' +
        M.empty({ icon: "clapperboard", title: t("p06.idle"), text: t("p06.idle.text"), btn: PC.kbtn(t("p05.make"), "enter", { kind: "primary", icon: "clapperboard" }) }) };
    },
    loading: function () {
      return { body: '<div class="m-steps"><div class="m-stepbar"><span class="m-stepseg"></span><span class="m-stepseg"></span><span class="m-stepseg"></span><span class="m-stepseg"></span><span class="m-stepseg"></span><span class="m-stepseg"></span><span class="m-stepseg"></span></div><div class="mt-2">' + M.skel(40, 16) + "</div></div>" +
        '<div class="mt-4">' + M.skel(55, 28) + "</div>" +
        M.card(M.skel(90) + '<div class="mt-3"><span class="m-skel-block" style="height:4px"></span></div><div class="mt-2">' + M.skel(30, 16) + "</div>", "mt-4") +
        M.eyebrow(t("p06.steps"), "mt-5") + M.card(M.skel(40) + M.skel(25, 16) + '<div class="mt-3"></div>' + M.skel(35) + M.skel(25, 16) + '<div class="mt-3"></div>' + M.skel(30) + M.skel(25, 16), "mt-2") };
    },
    normal: function () { return { body: head(RUN, 3, "busy") + building() + stepList(RUN) }; },
    "running-early": function () {
      var s = ["run", "pend", "pend", "pend", "pend", "pend", "pend"];
      D.item = P.newItem;
      return { body: head(s, 0, "busy") + current({ indet: true, text: t("p06.transcribing"), sub: t("p06.transcribing.sub"), time: "0:41", info: t("p06.claude_on") }) + stepList(s) };
    },
    focus: function () { return { body: head(RUN, 3, "busy") + building({ focus: true }) + stepList(RUN) }; },
    waiting: function () {
      var s = ["done", "done", "wait", "pend", "pend", "pend", "pend"];
      return { needs: 1, body: head(s, 2, "waiting") +
        M.card('<div class="m-row-top">' + M.status("waiting") + '<div class="t-body ms-2 m-grow">' + t("p06.waiting", { item: code(D.item) }) + "</div></div>" +
          '<div class="m-col mt-3">' + PC.kbtn(t("p06.waiting_link"), "enter", { kind: "primary", block: true, icon: "circle-check-big" }) + "</div>", "mt-4") + stepList(s) };
    },
    failed: function () {
      var s = ["done", "done", "done", "done", "fail", "pend", "pend"];
      return { body: head(s, 4, "error") + '<div class="mt-4"></div>' +
        M.notice("error", t("p06.failed", { item: code(D.item) }), { sub: t("p06.failed.sub"), btn: { label: t("action.retry"), icon: "refresh-cw", primary: true } }) +
        stepList(s) };
    },
    offline: function () {
      /* paused, not running: amber icon, solid amber bar, no spinner, no "Claude is working" line */
      var s = ["done", "done", "done", "pause", "pend", "pend", "pend"];
      return { pills: { engine: "off", claude: "unchecked", host: "unlinked" },
        body: slot(M.offline({ hintKey: "engine.off.hint_short" })) +
          head(s, 3, "paused") + current({ paused: true, text: t("p06.paused_at", { n: 23, of: 47 }), cancelOff: true }) + stepList(s) };
    },
    "no-claude": function () {
      var s = ["done", "pause", "pend", "pend", "pend", "pend", "pend"];
      D.item = P.newItem;
      return { pills: { claude: "signed_out" },
        body: head(s, 1, "paused") + '<div class="mt-4"></div>' +
          M.noClaude("signed_out", { text: t("p06.paused", { item: code(D.item) }) }) +
          stepList(s) };
    },
    "no-internet": function () {
      var s = ["done", "pause", "pend", "pend", "pend", "pend", "pend"];
      D.item = P.newItem;
      return { pills: { claude: "offline" },
        body: slot(M.noNet()) + head(s, 1, "paused") +
          current({ paused: true, noBar: true, text: t("p06.paused_net", { item: code(D.item) }), time: "1:05" }) + stepList(s) };
    },
    stale: function () {
      return { body: slot(M.stale()) + head(RUN, 3, "busy") + building() + stepList(RUN) };
    },
    done: function () {
      var s = ["done", "done", "done", "done", "done", "done", "done"];
      return { needs: 1, body: M.steps(s, 6, "ok") +
        M.card('<div class="m-row-top">' + M.status("ok") + '<div class="t-title ms-2 m-grow">' + t("p06.done.title", { item: code(D.item) }) + "</div></div>" +
          '<div class="t-body tx-muted mt-1">' + t("p06.done.sub") + "</div>" +
          '<div class="mt-3">' + M.saved('<span class="tx-text">' + t("p06.done.saved", { raw: M.html(M.mono(P.rawDur)), reel: M.html(M.mono(P.reelDur)), t: P.savedT[M.lang] }) + "</span>") + "</div>" +
          '<div class="mt-1">' + M.trust(t("p06.done.trust")) + "</div>" +
          '<div class="t-label mt-4">' + t("p06.done.verified") + "</div>" + list(M.status("ok"), [t("p06.v1"), t("p06.v2"), t("p06.v3")]) +
          '<div class="t-label mt-4">' + t("p06.done.not_verified") + "</div>" + list(M.status("pending"), [t("p06.n1")]) +
          '<div class="t-label mt-4">' + t("p06.done.needs_you") + "</div>" + list(M.status("waiting"), [t("p06.y1", { tc: M.html(M.mono("00:00:31:20")) })]) +
          '<div class="m-col mt-4">' + PC.kbtn(t("p06.open"), "enter", { kind: "primary", block: true, icon: "external-link" }) + "</div>" +
          '<div class="t-meta tx-muted mt-2">' + t("p06.open_note") + "</div>" +
          PC.acts([M.btn(t("p06.reveal"), { icon: "folder-open" })]), "mt-4") };
    },
    long: function () { return { body: head(RUN, 3, "busy") + building() + stepList(RUN) }; }
  };

  PC.mount({
    id: "P-06", name: "Pipeline progress",
    states: ["empty", "loading", "normal", "running-early", "focus", "waiting", "failed", "offline", "no-claude", "no-internet", "stale", "done", "long"], defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "edit";
      if (v.needs === undefined) v.needs = 0;
      return v;
    }
  });
})();
</script>
</body>
</html>
