<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="empty,loading,normal,older,verse,risky,domains,podcast,focus,error,offline,no-claude,long">
<meta name="mock-keys" content="Cmd/Ctrl+Enter: the first item's button (the violet one); Up/Down: move between items; Enter: the focused item's button; Esc: close the list and go back to where the badge was tapped; Tab order: Back, then each item's button top to bottom, then Open the list in the client folder">
<meta name="mock-motion" content="Opening from the badge: the list cross-fades in 200 ms ease (static fallback: instant); an item that is done fades out 200 ms and its space closes only after the fade (250 ms, the one allowed height change, at the bottom of the list so nothing above moves); the badge and Edit-tab count change number with a 150 ms colour pulse; skeleton shimmer 1200 ms linear (static fallback: flat bars).">
<title>P-10 Needs you</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/premiere-core.css">
<link rel="stylesheet" href="../css/panel-v1.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/premiere-core.js"></script>
<script src="../strings/panel-v1.js"></script>
<script src="../mockup.js"></script>
<script src="../js/premiere-core.js"></script>
<script src="../js/panel-v1.js"></script>
</head>
<body>
<script>
/* P-10 Needs you (screen-inventory.md §3 P-10; R2 fix list). Opens from the header badge (G3), so no tab is selected.
   - The badge, the Edit tab count and the list agree: ONE count (6 here; 7 in long, header and list alike: R2 D-P1-11).
   - Grouped by clip (current client), then "This computer" for app-wide items. Each row: kind icon (the pink Needs-you
     colour: these wait for the person, they are not problems), one sentence, a detail line, one button. The first
     item's button is the one primary; the rest are secondary.
   - R2 D-P0-1: when Needs-you is the only reason, the header has no status pill (the badge says it): no "running ready".
     The offline / error / no-Claude states derive their pill from the card.
   - Detail lines quote the words or lines as said (Arabic in both UIs) and the timecode as plain text (not a control).
   - older: a plan that was approved with an older WhyNot Cut is back in the list as the first item (the engine's
     OLDER_APPROVAL text, verbatim). It is information, not a fault: an amber line (never red) and the normal flow, "Review
     and approve" (the one primary) opens the approval screen (P-07 older), where the editor approves it again.
   - R3 (editor P1-01, fix list S-18, P-5): the older-approval row says WHO approved it, WHEN, with whom the lines were
     confirmed, and how many lines are unchanged ("2 of 3 lines unchanged"), the same facts as P-07 older (previous_approval,
     eng-data-contract §2.5); the claim row names who confirms: "The doctor or the sheikh".
   - empty is also the success state ("Nothing needs you right now."). Stale: not applicable.
   - Phase 4 states (UI track 2026-10-18; coverage map §2.1, wire = gap C-4, Stage 3):
     verse: the manual verse slot (owner 2026-10-18, executor brief): one row per recited-verse span, with ONLY the
       timecode, the cue phrase that opened it, the fixed marker name «آية: يضيفها المونتير يدويًا» and, when the engine
       capped the span at 12 s, "the end was guessed". Never the verse words (a misheard verse must never be copyable).
       The editor alone does it; "Go to the marker" seeks only, if the UXP lab proves the call (else plain timecode).
     risky: K-T1 risky words first: the words that change the meaning, as said, each with its reason (negation, how
       often, drug name, dose); Arabic-Indic digits stay as the speaker said them.
     domains: Addendum M review domains: one row per domain, each naming its own approver from the registry (the doctor;
       the content owner; the business owner or their legal adviser; the client), and "never approved automatically".
     podcast: the engine kinds the old list lacked: pick (the episode's reels, Gate 0) and logo. */
(function () {
  var t = M.t, D = M.D, P = PC.D;
  function tc(s) { return M.html(M.mono(s)); }
  var GROUPS = [
    { item: function () { return D.item; }, rows: [
      ["ear", "p10.k.words", function () { return t("p10.d.words", { tc: tc("00:00:31:20") }); }, "p10.b.listen", "play"],
      ["stethoscope", "p10.k.claim", function () { return t("p10.d.claim"); }, "p10.b.review", "circle-check-big"]
    ] },
    { item: function () { return P.newItem; }, rows: [
      ["type", "p10.k.fonts", function () { return t("p10.d.fonts"); }, "p10.b.fonts", "folder-open"],
      ["music", "p10.k.music", function () { return t("p10.d.music"); }, "p10.b.music", "external-link"]
    ] },
    { item: function () { return "C0236"; }, rows: [
      ["monitor-play", "p10.k.render", function () { return t("p10.d.render"); }, "p10.b.open", "external-link"]
    ] },
    { general: true, rows: [
      ["refresh-cw", "p10.k.restart", function () { return t("p10.d.restart"); }, "p10.b.check", "refresh-cw"]
    ] }
  ];
  /* a plan approved with an older WhyNot Cut: the detail line is the engine's text, in amber (information, not an error) */
  var PLAN = ["circle-check-big", "p10.k.plan", function () {
    var prev = D.previous_approval.older, kept = 0;
    D.flagged.forEach(function (f) {
      prev.lines.forEach(function (l) { if (l.graphic_id === f.id && l.text === f.text && l.checked) kept++; });
    });
    var by = t("approval.older.by", { name: prev.by === "Yunus" ? D.editor : prev.by, date: M.raw("demo.date") }) +
      (prev.confirmed_with ? " · " + t("approval.older.with", { who: D.who[M.lang] }) : "");
    return '<div class="m-row-top">' + M.status("warn", 12) + '<div class="ms-1 m-grow tx-text">' + t("approval.older") + "</div></div>" +
      '<div class="t-meta tx-muted mt-1">' + by + "</div>" +
      '<div class="t-meta tx-muted mt-1">' + t(kept === D.flagged.length ? "approval.prev.all" : "p10.older.kept", { n: kept, of: D.flagged.length }) + "</div>";
  }, "p10.b.plan", "circle-check-big"];
  var NUMBERS = ["hash", "p10.k.numbers", function () { return t("p10.d.numbers", { tc: tc("00:00:31:20") }); }, "p10.b.numbers", "circle-check-big"];

  /* ---- Phase 4 rows (UI track 2026-10-18; coverage map §2.1). Each is an engine NEEDS-YOU kind (lib/needs_you.py) or
     the executor's manual verse slot; the wire is gap C-4 (Stage 3). ---- */
  var V = V1.D;
  /* manual verse slot: one row per span. ONLY the timecode, the cue phrase, the fixed marker name and the guessed-end
     flag: never the span's words (executor brief). "Go to the marker" only moves the playhead (seek), and ships only if
     the UXP lab proves the call (else the timecode stays plain text, like P-07's seek). Who: the editor, never delegated. */
  function verseRow(sp) {
    return ["bookmark-plus", "p10.k.verse", function () {
      return t(sp.guessed ? "p10.d.verse_guess" : "p10.d.verse", { tc: tc(sp.tc), cue: sp.cue }) +
        '<div class="mt-1">' + t("p10.d.marker", { name: V.verse.marker }) + "</div>" +
        '<div class="m-row-top mt-1">' + M.ico("user-check", 12, "ink-muted") + '<div class="ms-1 m-grow">' + t("p10.who.editor") + "</div></div>";
    }, "p10.b.marker", "map-pin"];
  }
  /* risky words first (K-T1): the words as said (Arabic in both UIs, Arabic-Indic digits kept), each with its reason */
  var RISKY = ["triangle-alert", "p10.k.risky", function () {
    var chips = V.risky.map(function (r) {
      return '<span class="m-chip m-chip-neutral me-1 mt-1"><span class="m-block"><bdi dir="rtl" lang="ar">«' + V1.arTxt(r.w) + "»</bdi> · " + t("p10.r." + r.r) + "</span></span>";
    }).join("");
    return t("p10.d.risky", { n: M.html(M.ltr(String(V.risky.length))), tc: tc("00:00:31:20") }) + '<div class="m-row m-wrap">' + chips + "</div>";
  }, "p10.b.listen", "play"];
  /* review domains (Addendum M): one row per domain, each naming its approver from the registry */
  function domRow(icon, k) { return [icon, "p10.k." + k, function () { return t("p10.d." + k); }, "p10.b.review", "circle-check-big"]; }
  var DOMAINS = [domRow("stethoscope", "medical"), domRow("book-open", "religious"), domRow("briefcase", "business"), domRow("bot", "ai")];
  var PICK = ["list-video", "p10.k.pick", function () { return t("p10.d.pick"); }, "p10.b.pick", "list-video"];
  var LOGO = ["image", "p10.k.logo", function () { return t("p10.d.logo"); }, "p10.b.logo", "folder-open"];

  /* the groups a state shows (o.verse / o.risky / o.domains / o.podcast add the Phase 4 rows) */
  function groupsFor(o) {
    var gs = GROUPS.map(function (g) { return { item: g.item, general: g.general, rows: g.rows.slice() }; });
    var g0 = gs[0].rows;
    if (o.long) g0.push(NUMBERS);
    if (o.older) g0.unshift(PLAN);
    if (o.risky) g0[0] = RISKY;
    if (o.domains) g0.splice.apply(g0, [1, 1].concat(DOMAINS));
    /* every Phase 4 state names one approver per domain: the combined "doctor or sheikh" row is split */
    else if (o.verse || o.risky || o.podcast) g0.splice.apply(g0, [1, 1].concat(DOMAINS.slice(0, 2)));
    if (o.verse) { gs[0].note = t("p10.verse.why"); V.verse.spans.forEach(function (sp) { g0.push(verseRow(sp)); }); }
    if (o.podcast) {
      gs.splice(1, 0, { item: function () { return V.episode; }, rows: [PICK] });
      gs.splice(gs.length - 1, 0, { item: function () { return D.client; }, rows: [LOGO] });
    }
    return gs;
  }
  function total(o) { var n = 0; groupsFor(o || {}).forEach(function (g) { n += g.rows.length; }); return n; }

  function list(o) {
    o = o || {};
    var first = true, out = "";
    groupsFor(o).forEach(function (g, gi) {
      var rows = g.rows;
      var head = g.general
        ? '<div class="t-label">' + t("p10.general") + "</div>"
        : '<div class="t-label">' + M.ltr(g.item(), "lat code") + "</div>";
      if (g.note) head += '<div class="t-meta tx-muted mt-1">' + g.note + "</div>";
      if (o.domains && gi === 0) head += '<div class="t-meta tx-muted mt-1">' + t("p10.never_auto") + "</div>";
      var body = rows.map(function (r, ri) {
        var primary = first && !o.disabled; first = false;
        var dis = o.disabled || (o.noClaude && r[1] === "p10.k.music");
        var btn = M.btn(t(r[3]), { kind: primary ? "primary" : "secondary", icon: r[4], disabled: dis, focus: primary && o.focus, kbd: primary && !dis ? PC.k("enter") : false });
        var label = r[1] === "p10.k.restart" ? t(r[1], { app: "Premiere" }) : t(r[1]);
        /* the first row of a card sits under the card's heading; the 12 px row padding counts the 1 px divider */
        return '<div class="m-lrow">' + M.ico(r[0], 16, o.disabled ? "ink-disabled" : "ink-accent") +
          '<div class="m-lrow-text"><div class="t-body">' + label + '</div><div class="t-meta tx-muted">' + r[2]() + "</div>" +
          '<div class="m-row mt-2">' + btn + "</div></div></div>";
      }).join("");
      out += M.card(head + '<div class="m-col mt-1">' + body + "</div>", "mt-" + (gi ? 2 : 4));
    });
    return out;
  }
  function count(n) { return M.chip("neutral", M.ltr(String(n))); }
  function top(n) {
    return M.back(t("p02.back")) + '<div class="m-row"><div class="t-title m-grow">' + t("p10.title") + "</div>" + (n ? count(n) : "") + "</div>" +
      '<div class="t-body tx-muted mt-1">' + t("p10.sub") + "</div>";
  }
  function reveal() { return PC.acts([M.btn(t("p10.reveal"), { kind: "ghost", icon: "folder-open", flush: true })], "mt-2"); }
  function skelCard() {
    return M.card(M.skel(30) + '<div class="m-lrow"><span class="m-skel-block" style="width:16px;height:16px"></span><div class="m-lrow-text">' + M.skel(85) + M.skel(60, 16) +
      '<div class="mt-2"><span class="m-skel-block" style="width:112px;height:32px;display:block"></span></div></div></div>', "mt-4");
  }

  var STATES = {
    empty: function () {
      return { needs: 0, body: M.back(t("p02.back")) + M.empty({ icon: "circle-check", title: t("p10.empty"), text: t("p10.empty.text") }) };
    },
    loading: function () { return { needs: 6, body: top() + skelCard() + skelCard() }; },
    normal: function () { return { needs: 6, body: top(6) + list() + reveal() }; },
    older: function () { return { needs: 7, body: top(7) + list({ older: true }) + reveal() }; },
    /* Phase 4 (UI track 2026-10-18): the counts come from the rows themselves, so badge, Edit tab and list agree */
    verse: function () { var n = total({ verse: true }); return { needs: n, body: top(n) + list({ verse: true }) + reveal() }; },
    risky: function () { var n = total({ risky: true }); return { needs: n, body: top(n) + list({ risky: true }) + reveal() }; },
    domains: function () { var n = total({ domains: true }); return { needs: n, body: top(n) + list({ domains: true }) + reveal() }; },
    podcast: function () { var n = total({ podcast: true }); return { needs: n, body: top(n) + list({ podcast: true }) + reveal() }; },
    focus: function () { return { needs: 6, body: top(6) + list({ focus: true }) + reveal() }; },
    error: function () {
      return { needs: 6, body: top() + '<div class="mt-4">' + M.notice("error", t("p10.failed"), { sub: t("p10.failed.sub"), btn: { label: t("action.retry"), icon: "refresh-cw", primary: true } }) + "</div>" + reveal() };
    },
    offline: function () {
      return { needs: 6, pills: { engine: "off", claude: "unchecked", host: "unlinked" },
        body: M.offline({ hintKey: "p10.offline_hint" }) +
          '<div class="mt-4"></div>' + top(6) + list({ disabled: true }) + reveal() };
    },
    "no-claude": function () {
      return { needs: 6, pills: { claude: "signed_out" },
        body: top(6) + '<div class="mt-4">' + M.noClaude("signed_out", { primary: false, sub: t("p10.no_claude") }) + "</div>" + list({ noClaude: true }) + reveal() };
    },
    /* the list holds 7 items, so the badge and the Edit tab say 7 too (one count everywhere): the shell's long-text
       count of 99+ is replaced for this screen */
    long: function () { M.D.needs = 7; return { needs: 7, body: top(7) + list({ long: true }) + reveal() }; }
  };

  PC.mount({
    id: "P-10", name: "Needs you",
    states: ["empty", "loading", "normal", "older", "verse", "risky", "domains", "podcast", "focus", "error", "offline", "no-claude", "long"], defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "needs"; /* no tab is selected: the list opens from the badge */
      return v;
    }
  });
})();
</script>
</body>
</html>
