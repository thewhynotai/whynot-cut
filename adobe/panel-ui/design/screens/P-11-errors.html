<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="normal,link-refused,command,validation,panel,held,claude,no-claude,update,tools,working,dismissed,focus,long">
<meta name="mock-keys" content="Every card: its one button is reachable with Tab right after the card text; when the card's button is the screen's violet button, Cmd/Ctrl+Enter presses it; Esc dismisses the top dismissable card (the service and Claude cards cannot be dismissed while the problem lasts); focus moves to the next card after a dismiss">
<meta name="mock-motion" content="Card in: tint and border colour fade 200 ms ease into a reserved slot (no push-down of content mid-read); dismiss: fade out 150 ms, then the slot closes 200 ms; while a fix runs the button keeps its width and its icon becomes the loader (900 ms rotation, static fallback still); a fixed card turns into the ok card for 3 s.">
<title>P-11 Error cards</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/premiere-core.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/premiere-core.js"></script>
<script src="../mockup.js"></script>
<script src="../js/premiere-core.js"></script>
</head>
<body>
<script>
/* P-11 Error cards, catalogue (screen-inventory.md §3 P-11; G5 notice, G7 log drawer). Home tab.
   One state per group; each card appears alone in real use. Every card: icon, one sentence that names what failed,
   a "what next" line (except the validation notes), one button (or none for info notes), dismiss.
   In this catalogue every fix is secondary (no violet): in a real screen the fix is violet only when the screen's own
   primary is disabled (P-03 offline pattern).
   Mapping (trigger -> card), raw codes stay in the log:
   normal (link absent, fix Start WhyNot Cut): no_engine, down, unreachable, bad_engine_json, auth, no_welcome,
     lost (+ "tries again by itself"), stopped.
   link-refused (fix Contact support; protocol -> Update WhyNot Cut): refused_host, refused_busy, refused, protocol,
     too_large, blocked.
   command (notice.code.*, named after the action): rate, timeout, no_route -> Try again; auth/origin/host,
     too_large, internal -> Contact support; schema/unknown_type -> Update WhyNot Cut; not_yet -> Open Claude.
   validation (info, no button): need_name, need_changes, plan_changed, bad_frame, missing.
   panel: error.render, error.snapshot -> Contact support. held: notice.failed; the raw text is kept for support.
   claude / update: the P-02 cards. tools: Hush, Tidy, Kalam examples.
   working: the fix running (busy, disabled). dismissed: the copied-report confirmation after a card is closed.
   Addendum G2 / owner (e): support = Contact support (opens the configured support link); the log drawer (G7, open
   and empty) lives only in Settings > Details for support (P-22 states support / support-empty), never on a card.
   no-claude: Claude not open / signed out, one sentence + whose account, what it costs, what it reads + Open Claude. */
(function () {
  var t = M.t, D = M.D, P = PC.D;
  function code(s) { return PC.code(s); }
  var START = { label: t("action.start_app"), icon: "power" };
  var REPORT = { label: t("action.support"), icon: "headset" };
  var RETRY = { label: t("action.retry"), icon: "refresh-cw" };
  var UPDATE = { label: t("p02.btn.update"), icon: "download" };

  function group(titleKey, cards) {
    return M.eyebrow(t(titleKey), "mt-5") + cards.map(function (c, i) { return '<div class="mt-' + (i ? 2 : 2) + '">' + c + "</div>"; }).join("");
  }
  function top() { return PC.title(t("p11.title"), t("p11.sub")); }
  function e(text, sub, btn, kind) { return PC.notice(kind || "error", text, { sub: sub, btn: btn }); }

  var G = {
    absent: function (o) {
      o = o || {};
      return group("p11.g.absent", [
        e(t("engine.off"), t("p11.how.start"), { label: START.label, icon: START.icon, focus: o.focus }),
        e(t("p11.down"), t("p11.how.start"), START),
        e(t("p11.unreachable"), t("p11.how.start"), START),
        e(t("p11.bad_file"), t("p11.how.start"), START),
        e(t("p11.auth"), t("p11.how.start"), START),
        e(t("p11.no_welcome"), t("p11.how.start"), START),
        e(t("p11.lost"), t("p11.how.retrying"), START, "warn"),
        e(t("p11.stopped"), t("p11.how.start"), START)
      ]);
    },
    refused: function () {
      return group("p11.g.refused", [
        e(t("p11.refused_host"), t("p11.how.report"), REPORT),
        e(t("p11.refused_busy"), t("p11.refused_busy.sub"), REPORT),
        e(t("p11.refused"), t("p11.how.report"), REPORT),
        e(t("p11.protocol"), t("p11.protocol.sub"), UPDATE, "warn"),
        e(t("p11.too_large"), t("p11.how.report"), REPORT),
        e(t("p11.blocked"), t("p11.blocked.sub"), REPORT)
      ]);
    },
    command: function () {
      return group("p11.g.command", [
        e(t("p11.c.rate"), t("p11.c.rate.sub"), RETRY, "warn"),
        e(t("p11.c.timeout"), t("p11.c.timeout.sub"), RETRY),
        e(t("p11.c.no_route"), t("p11.c.no_route.sub"), RETRY),
        e(t("p11.c.auth"), t("p11.how.report"), REPORT),
        e(t("p11.c.too_large"), t("p11.c.too_large.sub"), null, "warn"),
        e(t("p11.c.schema"), t("p11.protocol.sub"), UPDATE),
        e(t("p11.c.internal"), t("p11.how.report"), REPORT),
        e(t("p11.c.not_yet"), t("p11.c.not_yet.sub"), { label: t("action.open_claude"), icon: "external-link" }, "info")
      ]);
    },
    validation: function () {
      return group("p11.g.validation", [
        PC.notice("info", t("p11.v.need_name")),
        PC.notice("info", t("p11.v.need_changes")),
        PC.notice("info", t("notice.plan_changed"), { sub: t("demo.diff") }),
        PC.notice("info", t("p11.v.bad_frame")),
        PC.notice("info", t("p11.v.missing", { item: code(P.newItem) }))
      ]);
    },
    panel: function () {
      return group("p11.g.panel", [
        e(t("p11.p.render"), t("p11.p.render.sub"), REPORT),
        e(t("p11.p.snapshot"), t("p11.p.snapshot.sub"), REPORT, "warn")
      ]);
    },
    held: function () { return group("p11.g.held", [e(t("p11.held"), t("p11.held.sub"), REPORT)]); },
    claude: function () {
      return group("p11.g.claude", [
        e(t("p02.claude.missing"), t("p02.claude.missing.sub"), { label: t("p02.btn.guide"), icon: "life-buoy" }),
        e(t("p02.claude.signed_out"), t("p02.claude.signed_out.sub"), { label: t("action.open_claude"), icon: "log-in" }, "warn"),
        e(t("p02.claude.old", { version: "2.2.1" }), t("p02.claude.old.sub"), { label: t("p02.btn.update_plugin"), icon: "download" }, "warn"),
        e(t("p02.claude.waiting", { item: code(D.item) }), null, { label: t("p02.btn.needs"), icon: "list-checks" }, "warn")
      ]);
    },
    update: function () {
      return group("p11.g.update", [
        e(t("update.stale"), null, { label: t("action.check_again"), icon: "refresh-cw" }, "warn"),
        e(t("p02.restart_once"), t("p02.restart_once.sub"), { label: t("action.check_again"), icon: "refresh-cw" }, "warn"),
        e(t("p02.older"), t("p02.older.sub"), UPDATE, "warn"),
        PC.notice("info", t("p02.staged"))
      ]);
    },
    tools: function () {
      return group("p11.g.tools", [
        e(t("p11.t.hush"), t("p11.t.hush.sub"), RETRY),
        e(t("p11.t.tidy"), t("p11.t.tidy.sub"), RETRY, "warn"),
        e(t("p11.t.kalam"), t("p11.t.kalam.sub"), { label: t("p11.btn.models"), icon: "cpu" }, "warn")
      ]);
    }
  };

  var STATES = {
    normal: function () { return { body: top() + G.absent() }; },
    "link-refused": function () { return { body: top() + G.refused() }; },
    command: function () { return { body: top() + G.command() }; },
    validation: function () { return { body: top() + G.validation() }; },
    panel: function () { return { body: top() + G.panel() }; },
    held: function () { return { body: top() + G.held() }; },
    claude: function () { return { pillx: { claude: ["warn", t("p02.pill.waiting")] }, needs: 2, body: top() + G.claude() }; },
    "no-claude": function () {
      return { pillx: { claude: ["warn", t("p02.pill.not_open")] }, body: top() + group("p11.g.claude", [PC.noClaude({ primary: false }), PC.noClaude({ signedOut: true, primary: false, sub: t("p02.claude.signed_out.sub") })]) };
    },
    update: function () { return { body: top() + G.update() }; },
    tools: function () { return { body: top() + G.tools() }; },
    working: function () {
      return { pills: { engine: "starting" }, body: top() + group("p11.g.working", [
        PC.notice("error", t("engine.off"), { sub: t("p11.how.start"), btn: { label: t("p11.starting_btn"), busy: true }, dismiss: false }),
        PC.notice("error", t("p11.c.timeout"), { sub: t("p11.c.timeout.sub"), btn: { label: t("action.retry"), icon: "refresh-cw", disabled: true } })
      ]) };
    },
    dismissed: function () { return { body: top() + group("p11.g.dismissed", [PC.notice("ok", t("p11.copied"))]) }; },
    focus: function () { return { body: top() + G.absent({ focus: true }) }; },
    long: function () { return { body: top() + G.claude() + G.validation() }; }
  };

  PC.mount({
    id: "P-11", name: "Error cards",
    states: ["normal", "link-refused", "command", "validation", "panel", "held", "claude", "no-claude", "update", "tools", "working", "dismissed", "focus", "long"],
    defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "home";
      if (v.needs === undefined) v.needs = 0;
      return v;
    }
  });
})();
</script>
</body>
</html>
