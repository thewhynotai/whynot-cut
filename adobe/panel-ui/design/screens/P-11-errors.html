<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="normal,link-refused,link-refused-live,command,command-live,validation,panel,held,held-live,claude,no-claude,update,tools,working,dismissed,dismissed-live,focus,long">
<meta name="mock-keys" content="Every card: its one button is reachable with Tab right after the card text; when the card's button is the screen's violet button, Cmd/Ctrl+Enter presses it; Esc dismisses the top dismissable card (the service and Claude cards cannot be dismissed while the problem lasts); focus moves to the next card after a dismiss">
<meta name="mock-motion" content="Card in: tint and border colour fade 200 ms ease into a reserved slot (no push-down of content mid-read); dismiss: fade out 150 ms, then the slot closes 200 ms; while a fix runs the button keeps its width and its icon becomes the loader (900 ms rotation, static fallback still); a fixed card turns into the ok card for 3 s.">
<title>P-11 Error cards</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/premiere-core.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/premiere-core.js"></script>
<script src="../mockup.js"></script>
<script src="../js/premiere-core.js"></script>
</head>
<body>
<script>
/* P-11 Error cards, catalogue (screen-inventory.md §3 P-11; G5 notice, G7 log drawer; R2 fix list). Home tab.
   One state per group; each card appears alone in real use. Every card: icon, one sentence that names what failed,
   a "what next" line (except the validation notes), ONE button that fixes THAT cause (or none for info notes), and a
   dismiss only on warn / info cards (an error card has none: the close button would hide the only fix).
   In this catalogue every fix is secondary (no violet) except the restart notice, which the shell turns violet: in a
   real screen the fix is violet only when the screen's own primary is disabled (P-03 offline pattern).
   R2 D-P1-6 / G-F-10: one cause, one button, never a script URL:
     service not running, not answering (merged: down, unreachable, no welcome), connection lost -> Start WhyNot Cut;
     damaged settings file -> Repair settings (keeps your clients); panel not accepted, panel and service different
     versions -> Update the panel / Update WhyNot Cut; connection closed unexpectedly, the panel stopped, the panel could
     not draw a screen -> Reload panel; security software blocked it -> Show what to allow; too many panels -> the support
     action. Faults whose fix is the same share one card.
   - D-05 + H24: the support action is shared (M.supportParts). NOT LIVE (the default; nothing is published): "Copy details
     for support" only copies and "Support page coming soon" sits beside it. LIVE (the engine provides support.url; the
     "-live" states): "Copy details and open support" is one click and the card adds "We reply within one working day
     [R3: Support (D-05 update 2026-10-16, R3-fix-list S-01): the WhatsApp chat is live, so the support action is "Copy details and open WhatsApp" + the reply promise by default; ?support=off draws the copy-only alternate.]
     (Sun–Thu, Cairo time)." The dismissed card says what happened in each state.
   R2 D-P1-10: no developer words ("a message was too large" is "the connection closed unexpectedly").
   R2 D-P0-1: each state sets the header to match its cards (pills for one cause, else the shell derives the pill).
   R2 E-P2-01: one pack name «حزمة الكابشن» (Caption pack); the brand is only the grey sublabel.
   no-Claude cards are the shell's M.noClaude (one sentence, one button, "What Claude sees"). */
(function () {
  var t = M.t, D = M.D, P = PC.D;
  function code(s) { return PC.code(s); }
  var START = { label: t("action.start_app"), icon: "power" };
  var REPORT = { support: true }; /* the shared support action (D-05, H24): see e() */
  var RETRY = { label: t("action.retry"), icon: "refresh-cw" };
  var UPDATE = { label: t("p02.btn.update"), icon: "download" };
  var REPAIR = { label: t("p11.btn.repair"), icon: "wrench" };
  var UPDATEP = { label: t("p11.btn.update_panel"), icon: "download" };
  var RELOAD = { label: t("p11.btn.reload"), icon: "refresh-cw" };
  var ALLOW = { label: t("p11.btn.allow"), icon: "shield-check" };

  function group(titleKey, cards) {
    return M.eyebrow(t(titleKey), "mt-5") + cards.map(function (c) { return '<div class="mt-2">' + c + "</div>"; }).join("");
  }
  function top() { return PC.title(t("p11.title"), t("p11.sub")); }
  function e(text, sub, btn, kind) {
    if (btn === REPORT) return M.notice(kind || "error", text, { sub: sub, support: true, promise: true });
    return M.notice(kind || "error", text, { sub: sub, btn: btn });
  }

  var G = {
    absent: function (o) {
      o = o || {};
      return group("p11.g.absent", [
        e(t("engine.off"), t("p11.how.start"), { label: START.label, icon: START.icon, focus: o.focus }),
        e(t("p11.down"), t("p11.how.start"), START),
        e(t("p11.lost"), t("p11.how.retrying"), START, "warn"),
        e(t("p11.bad_file"), t("p11.how.repair"), REPAIR),
        e(t("p11.stopped"), t("p11.how.reload"), RELOAD)
      ]);
    },
    refused: function () {
      return group("p11.g.refused", [
        e(t("p11.refused_host"), t("p11.how.update"), UPDATEP),
        e(t("p11.refused_busy"), t("p11.refused_busy.sub"), REPORT),
        e(t("p11.protocol"), t("p11.protocol.sub"), UPDATE, "warn"),
        e(t("p11.too_large"), t("p11.how.reload"), RELOAD),
        e(t("p11.blocked"), t("p11.blocked.sub"), ALLOW)
      ]);
    },
    command: function () {
      return group("p11.g.command", [
        e(t("p11.c.rate"), t("p11.c.rate.sub"), RETRY, "warn"),
        e(t("p11.c.timeout"), t("p11.c.timeout.sub"), RETRY),
        e(t("p11.c.no_route"), t("p11.c.no_route.sub"), RETRY),
        e(t("p11.c.auth"), t("p11.how.report"), REPORT),
        e(t("p11.c.too_large"), t("p11.c.too_large.sub"), null, "warn"),
        e(t("p11.c.schema"), t("p11.protocol.sub"), UPDATE),
        e(t("p11.c.internal"), t("p11.how.report"), REPORT),
        e(t("p11.c.not_yet"), t("p11.c.not_yet.sub"), { label: t("action.open_claude"), icon: "external-link" }, "info")
      ]);
    },
    validation: function () {
      return group("p11.g.validation", [
        M.notice("info", t("p11.v.need_name")),
        M.notice("info", t("p11.v.need_changes")),
        M.notice("info", t("notice.plan_changed"), { sub: t("demo.diff") }),
        M.notice("info", t("p11.v.bad_frame")),
        M.notice("info", t("p11.v.missing", { item: code(P.newItem) }))
      ]);
    },
    panel: function () {
      return group("p11.g.panel", [
        e(t("p11.p.render"), t("p11.p.render.sub"), RELOAD),
        e(t("p11.p.snapshot"), t("p11.p.snapshot.sub"), RETRY, "warn")
      ]);
    },
    held: function () { return group("p11.g.held", [e(t("p11.held"), t("p11.held.sub"), REPORT)]); },
    claude: function () {
      return group("p11.g.claude", [
        M.noClaude("missing", { primary: false, sub: t("p02.claude.missing.sub") }),
        M.noClaude("signed_out", { primary: false, sub: t("p02.claude.signed_out.sub") }),
        e(t("p02.claude.old", { version: "2.2.1" }), t("p02.claude.old.sub"), { label: t("p02.btn.update_plugin"), icon: "download" }, "warn"),
        M.notice("info", t("p02.claude.waiting", { item: code(D.item) }), { btn: { label: t("p02.btn.needs"), icon: "list-checks" } })
      ]);
    },
    update: function () {
      return group("p11.g.update", [
        M.stale(),
        e(t("p02.restart_once"), t("p02.restart_once.sub"), { label: t("action.check_again"), icon: "refresh-cw" }, M.COND.premiere_unlinked),
        e(t("p02.older"), t("p02.older.sub"), UPDATE, "warn"),
        M.notice("info", t("p02.staged"))
      ]);
    },
    tools: function () {
      return group("p11.g.tools", [
        e(t("p11.t.hush"), t("p11.t.hush.sub"), RETRY),
        e(t("p11.t.tidy"), t("p11.t.tidy.sub"), RETRY, "warn"),
        e(t("p11.t.kalam"), t("p11.t.kalam.sub"), { label: t("p11.btn.models"), icon: "cpu" }, "warn")
      ]);
    }
  };

  var STATES = {
    normal: function () { return { pills: { engine: "off" }, body: top() + G.absent() }; },
    "link-refused": function () { return { pills: { host: "unlinked" }, body: top() + G.refused() }; },
    command: function () { return { body: top() + G.command() }; },
    validation: function () { return { body: top() + G.validation() }; },
    panel: function () { return { body: top() + G.panel() }; },
    held: function () { return { body: top() + G.held() }; },
    claude: function () { return { needs: 2, body: top() + G.claude() }; },
    "no-claude": function () {
      return { body: top() + group("p11.g.claude", [M.noClaude("signed_out", { primary: false }), M.noClaude("missing", { primary: false })]) };
    },
    update: function () { return { body: top() + G.update() }; },
    tools: function () { return { body: top() + G.tools() }; },
    working: function () {
      return { pills: { engine: "starting" }, body: top() + group("p11.g.working", [
        M.notice("error", t("engine.off"), { sub: t("p11.how.start"), btn: { label: t("p11.starting_btn"), busy: true }, dismiss: false }),
        M.notice("error", t("p11.c.timeout"), { sub: t("p11.c.timeout.sub"), btn: { label: t("action.retry"), icon: "refresh-cw", disabled: true } })
      ]) };
    },
    dismissed: function () { return { body: top() + group("p11.g.dismissed", [M.notice("ok", t(M.supportLive ? "p11.copied.live" : "p11.copied"))]) }; },
    focus: function () { return { pills: { engine: "off" }, body: top() + G.absent({ focus: true }) }; },
    long: function () { return { body: top() + G.claude() + G.validation() }; }
  };

  PC.mount({
    id: "P-11", name: "Error cards",
    states: ["normal", "link-refused", "link-refused-live", "command", "command-live", "validation", "panel", "held", "held-live", "claude", "no-claude", "update", "tools", "working", "dismissed", "dismissed-live", "focus", "long"],
    defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "home";
      if (v.needs === undefined) v.needs = 0;
      return v;
    }
  });
})();
</script>
</body>
</html>
