<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="empty,loading,normal,focus,error,offline,no-claude,stale,success,long">
<meta name="mock-keys" content="Mod+Enter = Open project once the quality check has passed (while it is open the primary is Wait for QC, off, and Open anyway is a secondary; Render when nothing is rendered, Render again when stale, Try again on error); Esc = Cancel while rendering, else close the top notice; Alt+1 / Alt+2 = Home / Edit; Tab / Shift+Tab frame to frame, Enter opens the focused frame large. No single-key shortcuts.">
<meta name="mock-motion" content="Controls: background and border colour 150 ms ease (--mk-ease); focus = border colour only, no layout shift. Notices appear in a reserved slot, background colour 200 ms. Skeleton shimmer 1200 ms linear; static fallback = solid #242424 bars. Progress fill width 250 ms; the n-of-m text always carries the value. Every state is complete with no motion. Frames load into fixed boxes (no layout shift); a frame's verdict chip swaps at once.">
<title>A-04 Motion render, frames and handoff</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/tools-ae.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/tools-ae.js"></script>
<script src="../mockup.js"></script>
<script src="../js/tools-ae.js"></script>
</head>
<body>
<script>
/* A-04 Motion render, frames and handoff (screen-inventory.md §4 A-04; motion SKILL §2, §5: never "done" unless QC
   passed in the same report; Verified / Not verified / Needs you). Edit tab of the After Effects panel.
   - normal: rendered; the MP4 path in full, the frames (2 per row at 300 and 360, 3 at 480, each with its verdict as
     an icon + word), and the report in the three words. QC has not passed yet, so nothing says done; "Open project"
     is the primary.
   - loading: render progress per piece with Cancel. error: why the render failed + Try again (primary).
   - stale: the project changed after the render; "Render again" takes the fill.
   - success: QC passed; the done card (as in P-06) with the handoff line; Open project is the primary. While QC is open
     (normal) the primary is "Wait for QC" (off, with its reason) and "Open without the check" is a GHOST link under that
     reason, smaller than Re-render, which stays secondary (R3 designer F-11).
   - R3 (editor P1-05): a failed frame says "Has a problem" (never a name for who acts); the button that sends it to Claude is
     "Let Claude fix it". Only a fix that is really the editor's says "Needs you", with one line on what to do (no-claude:
     sign in). no-claude: the main action is "Sign in to Claude" (the notice), Wait for QC is off with a reason and no spinner.
   - R3 (S-06): offline keeps the last verdicts, greyed, with their own words; "Out of date" is only for a stale render.
   - offline: everything that needs the app is disabled; the notice's fix takes the fill.
   - focus: keyboard focus on Open project. long: long id and path. */
(function () {
  var t = M.t, D = M.D, X = D.ta;
  /* six 9:16 frames of the 34 s render, each drawn with the scene's own content (no empty box). Frame 5 is the one where
     the title touches the safe edge: Claude is fixing it (a04.v.not.fail). */
  var FRAMES = [
    ["01", '<span class="ta-fr-txt">قياس السكر الصبح</span><span class="ta-fr-bar"></span>', "pass", "00:02"],
    ["02", '<span class="ta-fr-line"></span><span class="ta-fr-line ta-fr-line-s"></span><span class="ta-fr-line"></span>', "pass", "00:07"],
    ["03", '<span class="ta-fr-num">126</span><span class="ta-fr-bar"></span>', "pass", "00:14"],
    ["04", '<span class="ta-fr-line ta-fr-line-s"></span><span class="ta-fr-line"></span><span class="ta-fr-line ta-fr-line-s"></span>', "pending", "00:22"],
    ["05", '<span class="ta-fr-txt">اسأل دكتورك</span><span class="m-media-bad"></span>', "fix", "00:30"],
    ["06", '<span class="ta-fr-txt">قبل ما تغيّر علاجك</span><span class="ta-fr-bar"></span>', "pending", "00:33"]
  ];
  var COVER = '<span class="ta-fr-txt">قياس السكر</span><span class="ta-fr-bar"></span>';

  function heading(id) {
    return '<div class="t-title">' + t("a04.title") + '</div><div class="t-meta tx-muted mt-1">' + M.mono(id || X.motion) + '</div>';
  }
  function steps(st, cur, kind) { return M.steps(st, cur, kind) + '<div class="mt-4"></div>'; }
  var AT_QC = ["done", "done", "done", "done", "done", "run", "pend"];
  function fileCard(o) {
    o = o || {};
    return M.card('<div class="t-meta tx-muted">' + t("a04.mp4") + '</div>' +
      '<div class="mt-1">' + TA.name(o.mp4 || X.mp4) + '</div>' +
      '<div class="m-row mt-3">' + M.media({ kind: "poster", w: 64, h: 112, inner: COVER, disabled: o.off }) +
      '<div class="m-col m-grow ms-3"><div class="t-label">' + t("a04.cover") + '</div><div class="t-meta tx-muted">' + M.mono("1080 × 1920 · 00:34") + '</div></div></div>', "");
  }
  /* who acts is on the status row (owner F-18): "Claude is checking", "Claude is fixing", "Needs your editor"; a stale render
     has no live verdicts at all (nothing spins, no old Fix chip): "Out of date" */
  /* a short status row (icon + wrapping meta text), not a chip: the words are long and a tile is narrow at 280 px */
  function chipFor(kind, mode) {
    var row = function (icon, key, tx) { return '<div class="ta-srow">' + icon + '<div class="t-meta ' + (tx || "tx-text") + ' ms-1 m-grow">' + t(key) + '</div></div>'; };
    if (mode === "stale") return row(M.status("paused", 12), "a04.f.stale");
    /* offline (S-06): the last verdicts stay, greyed, in their own words; nothing spins and nothing says "Out of date" */
    if (mode === "off") {
      return kind === "pass" ? row(M.ico("circle-check", 12, "ink-disabled"), "a04.f.pass", "tx-disabled")
        : kind === "fix" ? row(M.ico("circle-x", 12, "ink-disabled"), "a04.f.fix", "tx-disabled")
        : row(M.ico("circle-dashed", 12, "ink-disabled"), "a04.f.unchecked", "tx-disabled");
    }
    if (kind === "pass") return row(M.status("ok", 12), "a04.f.pass");
    /* no Claude: only the problem frame is the editor's (sign in); the rest simply were not checked yet */
    if (mode === "editor") return kind === "fix" ? row(M.status("waiting", 12), "a04.f.editor") : row(M.status("pending", 12), "a04.f.unchecked");
    if (kind === "fix") return row(M.status("error", 12), "a04.f.fix");
    return row(M.status("busy", 12), "a04.f.pending");
  }
  function frameTile(f, mode) {
    var kind = f[2];
    var stale = mode === "stale" || mode === "off";
    var media = M.media({ kind: "poster", w: 54, h: 96, inner: f[1], safe: kind === "fix" && !stale, disabled: stale });
    return '<div class="ta-cell">' + M.tile({
      media: '<div class="ta-mediarow">' + media + '</div>',
      meta: '<div class="m-row mt-2">' + M.mono(f[3]) + '</div><div class="m-row mt-1">' + chipFor(kind, mode) + '</div>',
      fail: kind === "fix" && !stale, disabled: stale
    }) + '</div>';
  }
  function frames(o) {
    o = o || {};
    /* every frame passed: the fixed frame draws its corrected bar, never the red problem box */
    var list = FRAMES.map(function (f) {
      return o.all ? [f[0], f[1].replace('<span class="m-media-bad"></span>', '<span class="ta-fr-bar"></span>'), "pass", f[3]] : f;
    });
    return M.card('<div class="t-label">' + t("a04.frames") + '</div><div class="t-meta tx-muted">' + t("a04.frames.sub", { n: 6 }) + '</div>' +
      '<div class="ta-tiles mt-2">' + list.map(function (f) { return frameTile(f, o.mode); }).join("") + '</div>', "mt-4");
  }
  function report(passed, mode) {
    var rows = [["ok", t("a04.v.verified"), "", t("a04.v.verified.t")]];
    if (!passed) rows.push([mode === "editor" ? "waiting" : "pending", t("a04.v.not"), "", t("a04.v.not.t") + '<br>' + t(mode === "editor" ? "a04.v.not.fail.nc" : "a04.v.not.fail")]);
    rows.push(["waiting", t("a04.v.needs"), "", t("a04.v.needs.t")]);
    /* R3 (P-2): the frame with a problem has ONE button that sends it to Claude; without Claude there is none (sign in first) */
    return M.card('<div class="t-label">' + t("a04.verdict") + '</div>' + M.stages(rows) +
      (!passed && mode !== "editor" ? '<div class="m-row mt-3">' + M.btn(t("a04.fix"), { icon: "pen-line" }) + '</div>' : ''), "mt-4");
  }
  /* mode: "qc" (the quality check is still open: the primary is "Wait for QC", off, and "Open anyway" is a secondary,
     owner F-13) | "open" (QC passed: Open project is the violet) | "secondary" (a notice above carries the violet) | "off" */
  function actions(o) {
    o = o || {};
    var mode = o.mode || "qc";
    /* R3 (designer F-11): "Open without the check" is a ghost link under the reason, never a full-width button; the paused
       icon (not a spinner) when Claude cannot run the check (S-06) */
    var main = mode === "qc"
      ? M.btn(t("a04.wait_qc"), { kind: "primary", block: true, icon: o.noClaude ? "circle-pause" : "busy", disabled: true }) +
        '<div class="t-meta tx-muted mt-2">' + t(o.noClaude ? "a04.wait_qc.hint.nc" : "a04.wait_qc.hint") + '</div><div class="m-row mt-1">' +
        M.btn(t("a04.open_anyway"), { kind: "ghost", icon: "external-link", flush: true, focus: o.focus, disabled: o.off, cls: "m-needs-host" }) + '</div>'
      : M.btn(t("a01.open_aep"), { kind: mode === "open" ? "primary" : "secondary", block: true, icon: "external-link", focus: o.focus, disabled: mode === "off", cls: "m-needs-host" }) +
        (mode === "off" ? TA.reason("home.edit.needs_service") : "");
    return '<div class="m-col mt-4">' + main + '</div>' +
      '<div class="ta-btnrow mt-2">' + M.btn(t("a04.rerender"), { icon: "rotate-ccw", disabled: o.off || mode === "off", cls: "m-needs-host" }) + M.btn(t("a01.reveal"), { kind: "ghost", icon: "folder-open" }) + '</div>';
  }

  var STATES = {
    empty: function () {
      return {
        needs: 0,
        body: steps(["done", "done", "done", "done", "wait", "pend", "pend"], 4, "waiting") + heading() +
          M.empty({ icon: "monitor-play", title: t("a04.empty.title"), text: t("a04.empty"), btn: M.btn(t("a04.render"), { kind: "primary", icon: "monitor-play" }), cls: "mt-4" })
      };
    },
    loading: function () {
      return {
        needs: 0,
        body: steps(["done", "done", "done", "done", "run", "pend", "pend"], 4, "busy") + heading() +
          M.card(TA.progress(t("a04.progress", { n: 3, of: 8 }), 37, t("p13.elapsed", { t: M.html(M.mono("00:52")) }), t("a01.cancel")), "mt-4") +
          M.card(M.skel(25) + '<div class="ta-tiles mt-2"><div class="ta-cell"><span class="m-skel-block" style="height:96px"></span></div><div class="ta-cell"><span class="m-skel-block" style="height:96px"></span></div></div>', "mt-4")
      };
    },
    normal: function () {
      return {
        body: M.slot(M.notice("info", t("a04.rendered"), { sub: t("a04.not_done") })) + steps(AT_QC, 5, "busy") + heading() +
          '<div class="mt-4"></div>' + fileCard() + frames() + report() + actions()
      };
    },
    focus: function () {
      return {
        body: M.slot(M.notice("info", t("a04.rendered"), { sub: t("a04.not_done") })) + steps(AT_QC, 5, "busy") + heading() +
          '<div class="mt-4"></div>' + fileCard() + frames() + report() + actions({ focus: true })
      };
    },
    error: function () {
      return {
        needs: 0,
        body: M.slot(M.notice("error", t("a04.error"), { sub: t("a04.error.hint"), btn: { label: t("action.retry"), icon: "refresh-cw", primary: true } })) +
          steps(["done", "done", "done", "done", "fail", "pend", "pend"], 4, "error") + heading() + actions({ mode: "secondary" })
      };
    },
    offline: function () {
      return {
        pills: TA.pillsOff,
        body: M.slot(M.offline()) + steps(["done", "done", "done", "done", "done", "wait", "pend"], 5, "paused") + heading() + '<div class="mt-4"></div>' + fileCard({ off: true }) + frames({ mode: "off" }) + actions({ mode: "off", off: true })
      };
    },
    "no-claude": function () {
      return {
        pills: TA.pillsNoClaude,
        body: TA.noClaude("a04.no_claude", { primary: true }) + steps(["done", "done", "done", "done", "done", "wait", "pend"], 5, "waiting") + heading() + '<div class="mt-4"></div>' + fileCard() + frames({ mode: "editor" }) + report(false, "editor") + actions({ noClaude: true })
      };
    },
    stale: function () {
      return {
        body: M.slot(M.notice("warn", t("a04.stale"), { btn: { label: t("a04.render_again"), icon: "monitor-play", primary: true } })) +
          steps(["done", "done", "done", "done", "wait", "pend", "pend"], 4, "waiting") + heading() + '<div class="mt-4"></div>' + fileCard() + frames({ mode: "stale" }) + actions({ mode: "secondary" })
      };
    },
    success: function () {
      return {
        body: M.slot(M.notice("ok", t("a04.done", { item: TA.code(X.motion) }), { sub: t("a04.handoff") })) +
          steps(["done", "done", "done", "done", "done", "done", "done"], 6, "ok") + heading() + '<div class="mt-2">' + M.saved(t("a04.value")) + '</div><div class="mt-4"></div>' + fileCard() + frames({ all: true }) + report(true) + actions({ mode: "open" })
      };
    },
    long: function () {
      return {
        body: steps(AT_QC, 5, "busy") + heading(X.long.motion) + '<div class="mt-4"></div>' + fileCard({ mp4: X.long.mp4 }) + frames() + report() + actions()
      };
    }
  };

  TA.mount({
    id: "A-04", name: "Motion render, frames and handoff",
    states: ["empty", "loading", "normal", "focus", "error", "offline", "no-claude", "stale", "success", "long"], defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "edit";
      if (v.needs === undefined) v.needs = 1;
      return v;
    }
  }, { ae: true });
})();
</script>
</body>
</html>
