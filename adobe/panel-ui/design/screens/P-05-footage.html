<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="empty,loading,normal,several,intake,focus,error,offline,no-claude,stale,locked,success-live,success-later,long">
<meta name="mock-keys" content="Cmd/Ctrl+Enter: Make my edit (when it is off, the violet fix of the card on top); Up/Down: choose which new clip to edit; Cmd/Ctrl+O: Open folder; Esc: dismiss the top card (not the service or Claude card); Tab order: Open folder, warning fixes top to bottom, Make my edit">
<meta name="mock-motion" content="A new clip row fades in 200 ms ease into a reserved row (rows below move only when a file arrives, never while reading); chip colour change New to In progress 200 ms; Make my edit press: fill colour 150 ms, then the label keeps its width while the icon becomes the busy loader (static fallback: loader still); skeleton shimmer 1200 ms linear (static fallback: flat bars). The pinned action bar never moves.">
<title>P-05 New footage and Make my edit</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/premiere-core.css">
<link rel="stylesheet" href="../css/panel-v1.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/premiere-core.js"></script>
<script src="../strings/panel-v1.js"></script>
<script src="../mockup.js"></script>
<script src="../js/premiere-core.js"></script>
<script src="../js/panel-v1.js"></script>
</head>
>
<body>
<script>
/* P-05 New footage and Make my edit (screen-inventory.md §3 P-05; Addendum G2; R2 fix list). Edit tab.
   - Where footage goes, by folder NAME ("the raw folder inside Sahha Clinic's folder") + Open folder; the panel
     watches the folder (UXP takes no OS drop).
   - R2 E-P2-09: every "New" clip is a radio row; the bar says which clip will be edited, and "You'll edit C0241 (not
     C0239)" when it differs from the clip in the header. "In progress" is a neutral chip (amber is for problems).
   - Early checks (logo, fonts) as warn cards with one fix each.
   - Make my edit in the pinned bar, with what Claude does and the trust line (a new project file; footage and other
     projects untouched) and the keycap hint.
   - R2: offline / no-Claude / stale are the shell's M.offline / M.noClaude / M.stale. error: the request did not reach
     Claude (the internet dropped); the notice's Try again is the violet and Make my edit is OFF with the reason.
   - locked (backlog B-02): another editor works on the clip: who and since when, Open read-only (violet) / Take over.
   - File names break only at "_" and keep their start and end (M.mid) in a row.
   - R3 (fix list S-02, S-15): locked names its reason in the header ("Waiting for Mona", amber), not the generic "Waiting"; the
     "Make all" secondary needs Premiere (m-needs-host), so a restart notice switches it off like the primary. */
(function () {
  var t = M.t, D = M.D, P = PC.D;
  var NEWI = P.newItem;

  function chip(state) {
    return { "new": M.chip("info", t("p05.state.new"), "circle-dashed"), in_progress: M.chip("neutral", t("p05.state.in_progress"), "loader-circle"),
      edited: M.chip("ok", t("p05.state.edited"), "circle-check") }[state];
  }
  function idOf(c) { return c.id === "C0241" ? NEWI : c.id === "C0239" ? D.item : c.id; }
  function where() {
    return PC.title(t("p05.title"), t("p05.where", { raw: M.html(M.mono(P.rawName)), client: D.client })) +
      PC.acts([PC.kbtn(t("p04.open_folder"), "mod+O", { icon: "folder-open" })], "");
  }
  /* New clips are radio rows (the first is chosen); the others are plain rows */
  function clipList(set, o) {
    o = o || {};
    var radios = "", plain = "", seen = 0;
    set.forEach(function (c) {
      var sub = t("p04.clip.meta", { dur: M.html(M.mono(c.dur)), when: M.raw(c.when) });
      if (c.state === "new") {
        radios += (seen ? '<div class="mt-1"></div>' : "") + M.radio(PC.name(idOf(c)).html, seen === 0 && !o.none, { sub: sub, end: '<span class="ms-2">' + chip(c.state) + "</span>", disabled: !!o.none });
        seen++;
      } else {
        plain += M.listrow("film", PC.name(idOf(c)).html, sub, chip(c.state));
      }
    });
    return M.eyebrow(t("p05.clips"), "mt-5") + M.card(radios + (radios && plain ? '<span class="m-divider mt-2"></span>' : "") + plain, "mt-2");
  }
  var ONE = [P.clips[0], P.clips[2], P.clips[3]];
  var TWO = [P.clips[0], P.clips[1], P.clips[2], P.clips[3]];
  function warnings(o) {
    o = o || {};
    return '<div class="mt-4">' + M.notice("warn", t("p05.warn.logo"), { sub: t("p05.warn.sub"), btn: { label: t("p05.btn.logo"), icon: "folder-open" } }) + "</div>" +
      (o.both ? '<div class="mt-2">' + M.notice("warn", t("p05.warn.fonts"), { sub: t("p05.warn.sub"), btn: { label: t("p05.btn.fonts"), icon: "folder-open" } }) + "</div>" : "");
  }
  function bar(o) {
    o = o || {};
    var differs = NEWI !== D.item ? '<div class="t-label">' + t("p05.bar.differs", { item: PC.code(NEWI), cur: PC.code(D.item) }) + "</div>" : "";
    return differs + '<div class="t-meta tx-muted mt-1">' + t("p05.bar.one", { item: PC.code(NEWI) }) + "</div>" +
      '<div class="mt-1">' + M.trust(t("p05.trust")) + "</div>" +
      '<div class="m-col mt-2">' + PC.kbtn(t("p05.make"), "enter", { kind: "primary", block: true, icon: "clapperboard", disabled: o.disabled, focus: o.focus }) +
      (o.all ? '<div class="mt-2"></div>' + M.btn(t("p05.make_all", { n: 2 }), { block: true, icon: "clapperboard", cls: "m-needs-host", disabled: o.disabled }) : "") + "</div>" +
      (o.hint ? '<div class="t-meta tx-muted mt-2">' + o.hint + "</div>" : "");
  }
  function slot(n) { return n + '<div class="mt-4"></div>'; }
  /* Phase 4 (T4.8 intake warnings + Task 26): what WhyNot Cut noticed in the new material, informational (amber, never
     blocking); a check that could not run is said plainly and never counted as fine. Wire: gap C-3/C-6, Stage 3. */
  var INTAKE = [["film", "episode_in_raw", "raw"], ["captions", "burned_captions", ""], ["clock", "vfr", ""], ["image", "broll_licence", "broll"]];
  function intake() {
    var rows = INTAKE.map(function (w) {
      return '<div class="m-lrow">' + M.status("warn") + '<div class="m-lrow-text"><div class="t-body">' + t("p05.w." + w[1]) + "</div>" +
        '<div class="t-meta tx-muted">' + t("p05.w." + w[1] + ".why") + "</div>" +
        (w[2] ? '<div class="m-row mt-2">' + M.btn(t("p05.intake.open." + w[2]), { icon: "folder-open" }) + "</div>" : "") + "</div></div>";
    }).join("");
    return M.card('<div class="t-label">' + t("p05.intake.title", { n: M.html(M.ltr(String(INTAKE.length))) }) + "</div>" +
      '<div class="t-meta tx-muted mt-1">' + t("p05.intake.sub") + '</div><div class="m-col mt-1">' + rows + "</div>" +
      '<div class="m-row-top mt-2">' + M.status("info", 12) + '<div class="t-meta tx-muted ms-1 m-grow">' + t("p05.intake.unread") + "</div></div>", "mt-4");
  }

  var STATES = {
    empty: function () {
      return { body: M.empty({ icon: "folder-input", title: t("p05.empty"), text: t("p05.empty.text", { raw: M.html(M.mono(P.rawName)), client: D.client }),
          btn: PC.kbtn(t("p04.open_folder"), "mod+O", { kind: "primary", icon: "folder-open" }) }) +
          clipList([P.clips[2], P.clips[3]]) };
    },
    loading: function () {
      var r = function () { return '<div class="m-lrow m-lrow-dense"><span class="m-skel-block" style="width:16px;height:16px"></span><div class="m-lrow-text"><span class="m-skel-bar" style="width:64px;display:block;margin-top:6px"></span>' + M.skel(40, 16) + '</div><div class="m-lrow-end"><span class="m-skel-block" style="width:56px;height:24px"></span></div></div>'; };
      return { body: '<div class="m-col">' + M.skel(40, 28) + M.skel(95, 20) + M.skel(60, 20) + '</div><span class="m-skel-block mt-2" style="width:132px;height:32px"></span>' +
          M.eyebrow(t("p05.clips"), "mt-5") + M.card(r() + r() + r(), "m-card-flush mt-2"),
        bar: '<div class="m-col">' + M.skel(85, 16) + M.skel(50, 16) + '<div class="mt-2"></div><span class="m-skel-block" style="height:40px"></span></div>' };
    },
    normal: function () { return { body: where() + warnings() + clipList(ONE), bar: bar() }; },
    several: function () { return { body: where() + warnings({ both: true }) + clipList(TWO), bar: bar({ all: true }) }; },
    intake: function () { return { body: where() + intake() + clipList(TWO), bar: bar({ all: true }) }; },
    focus: function () { return { body: where() + warnings() + clipList(ONE), bar: bar({ focus: true }) }; },
    error: function () {
      /* the request never reached Claude: the notice's fix is the violet, Make my edit waits (R2 D-P2-7) */
      return { body: slot(M.notice("error", t("p05.failed", { item: PC.code(NEWI) }), { sub: t("p05.failed.sub"), btn: { label: t("action.retry"), icon: "refresh-cw", primary: true } })) +
        where() + clipList(ONE), bar: bar({ disabled: true, hint: t("p05.fix_first") }) };
    },
    offline: function () {
      return { pills: { engine: "off", claude: "unchecked", host: "unlinked" },
        body: slot(M.offline({ hintKey: "engine.off.hint_short" })) + where() + clipList(ONE), bar: bar({ disabled: true, hint: t("p05.need_app") }) };
    },
    "no-claude": function () {
      return { pills: { claude: "signed_out" },
        body: slot(M.noClaude("signed_out")) + where() + clipList(ONE), bar: bar({ disabled: true, hint: t("p05.need_claude") }) };
    },
    stale: function () { return { body: slot(M.stale()) + where() + clipList(ONE), bar: bar() }; },
    locked: function () {
      var set = [{ id: "C0241", state: "in_progress", dur: "1:42", when: "p04.demo.today" }, P.clips[2], P.clips[3]];
      return { status: { kind: "warn", text: t("p05.pill.locked", { who: "Mona" }) },
        body: slot(M.notice("info", t("p05.locked", { who: "Mona", item: PC.code(NEWI), since: M.html(M.mono("14:10")) }), { sub: t("p05.locked.sub", { who: "Mona" }), dismiss: false,
          extra: PC.acts([M.btn(t("p05.lock.readonly"), { kind: "primary", icon: "eye", kbd: true }), M.btn(t("p05.lock.takeover"), { icon: "log-in" })], "mt-1") })) +
        where() + clipList(set, { none: true }), bar: bar({ disabled: true, hint: t("p05.lock.first") }) };
    },
    "success-live": function () {
      var set = [{ id: "C0241", state: "in_progress", dur: "1:42", when: "p04.demo.today" }, P.clips[2], P.clips[3]];
      return { body: slot(M.notice("ok", t("p05.sent_live", { item: PC.code(NEWI) }), { sub: t("p05.sent_live.sub") })) +
        M.steps(["run", "pend", "pend", "pend", "pend", "pend", "pend"], 0, "busy") +
        PC.acts([M.btn(t("p05.see_progress"), { icon: "list-checks" })], "mt-1") + clipList(set, { none: true }) };
    },
    "success-later": function () {
      return { status: { kind: "waiting", text: t("p05.pill.later") },
        body: M.notice("ok", t("p05.sent_later"), { sub: t("p05.sent_later.sub") }) +
        '<div class="m-col mt-3">' + PC.kbtn(t("action.open_claude"), "enter", { kind: "primary", block: true, icon: "external-link" }) + "</div>" +
        '<div class="mt-4"></div>' + where() + clipList(ONE) };
    },
    long: function () { return { body: where() + warnings({ both: true }) + clipList(TWO), bar: bar({ all: true }) }; }
  };

  PC.mount({
    id: "P-05", name: "New footage and Make my edit",
    states: ["empty", "loading", "normal", "several", "intake", "focus", "error", "offline", "no-claude", "stale", "locked", "success-live", "success-later", "long"],
    defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "edit";
      if (v.needs === undefined) v.needs = 0;
      return v;
    }
  });
})();
</script>
</body>
</html>
