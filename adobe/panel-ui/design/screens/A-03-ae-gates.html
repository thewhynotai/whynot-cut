<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="loading,normal,focus,probe,fonts,unsaved,edited,edited-confirm,no-bridge,script-only,needs-you,success,offline,no-claude,long">
<meta name="mock-keys" content="Mod+Enter = the first card's fix; in the Rebuild sheet Mod+Enter = Rebuild and Esc = Keep my project; Esc = close the top notice; Alt+1 / Alt+2 = Home / Edit; Tab / Shift+Tab card to card. No single-key shortcuts.">
<meta name="mock-motion" content="Controls: background and border colour 150 ms ease (--mk-ease); focus = border colour only, no layout shift. Notices appear in a reserved slot, background colour 200 ms. Skeleton shimmer 1200 ms linear; static fallback = solid #242424 bars. Progress fill width 250 ms; the n-of-m text always carries the value. Every state is complete with no motion. A solved card turns into the ok notice in place, then leaves on the next refresh (no slide). Confirm sheet: appears in the pinned bar (the bar content swaps, background colour 200 ms, no slide, no overlay).">
<title>A-03 After Effects gates and Needs-you cards</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/tools-ae.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/tools-ae.js"></script>
<script src="../mockup.js"></script>
<script src="../js/tools-ae.js"></script>
</head>
<body>
<script>
/* A-03 After Effects gates and Needs-you cards (screen-inventory.md §4 A-03; motion SKILL §4: motion-build refuses
   without approval of the current plan, an ok Arabic probe for this After Effects version, installed brand fonts, or
   while After Effects holds unsaved work; an edited .aep is only replaced with a backup; script-only builds cannot
   pass QC). Home tab of the After Effects panel.
   - Each reason is one card: a title, one sentence, one button (the probe card has none: Claude runs it). When several
     block at once (normal = the catalogue), the first card's button takes the violet fill and the rest are secondary.
   - edited-confirm: Rebuild opens the confirm dialog in the pinned bar with the backup name of the edited project.
   - needs-you: what only the editor can do for this motion video (music, numbers, final look and export).
   - success: the card turns to an ok notice and leaves. offline: the app card replaces all the gate cards.
   - Empty, loading, stale: not applicable. focus: keyboard focus on the first card's button. long: long id. */
(function () {
  var t = M.t, D = M.D, X = D.ta;

  function intro() {
    return M.steps(["done", "done", "done", "wait", "pend", "pend", "pend"], 3, "warn") +
      '<div class="t-title mt-4">' + t("a03.title") + '</div><div class="t-meta tx-muted mt-1">' + t("a03.sub") + '</div>';
  }
  /* a gate card: notice-shaped, with a title line */
  function gate(kind, key, o) {
    o = o || {};
    var title = '<div class="t-label">' + t("a03." + key + ".t") + '</div>';
    var body = '<div class="t-body tx-text mt-1">' + t("a03." + key, { version: X.aeVersion }) + '</div>' + (o.sub ? '<div class="t-meta tx-muted mt-1">' + o.sub + '</div>' : '') +
      (o.btn ? '<div class="m-row mt-3">' + M.btn(o.btn, { kind: o.primary ? "primary" : "secondary", icon: o.icon, focus: o.focus }) + '</div>' : '');
    return '<div class="m-notice m-notice-' + kind + ' mt-3" role="' + (kind === "error" ? "alert" : "status") + '">' +
      (key === "probe" ? M.status("busy") : M.status(kind)) + '<div class="m-notice-body">' + title + body + '</div></div>';
  }
  var G = {
    probe: function () { return gate("info", "probe", { sub: t("a03.probe.meta") }); },
    fonts: function (p, f) { return gate("error", "fonts", { sub: t("a03.fonts.list", { fonts: M.html(M.ltr("Cairo Bold, Tajawal Medium")) }), btn: t("a03.fonts.btn"), icon: "folder-open", primary: p, focus: f }); },
    unsaved: function (p, f) { return gate("warn", "unsaved", { btn: t("p13.retry"), icon: "refresh-cw", primary: p, focus: f }); },
    edited: function (p, f) { return gate("warn", "edited", { btn: t("a03.rebuild"), icon: "rotate-ccw", primary: p, focus: f }); },
    no_bridge: function (p, f) { return gate("error", "no_bridge", { btn: t("p13.check_again"), icon: "refresh-cw", primary: p, focus: f }); },
    script_only: function (p, f) { return gate("warn", "script_only", { sub: t("a03.script_only.hint"), btn: t("p13.open_claude"), icon: "external-link", primary: p, focus: f }); }
  };
  function startOff() {
    return '<div class="m-col mt-4">' + M.btn(t("a01.start"), { kind: "primary", block: true, icon: "layers", disabled: true }) + '</div>' +
      '<div class="t-meta tx-muted mt-2">' + t("a03.blocked") + '</div>';
  }
  function one(key) { return { needs: key === "probe" ? 0 : 1, body: intro() + G[key](true) + startOff() }; }

  var STATES = {
    loading: function () {
      var c = function () { return '<div class="m-skel-box mt-3"><span class="m-skel-block" style="width:16px;height:16px"></span><div class="m-col m-grow ms-3">' + M.skel(40) + M.skel(90, 16) + M.skel(60, 16) + '</div></div>'; };
      return { needs: 0, body: intro() + c() + c() + c() };
    },
    "no-claude": function () {
      return { needs: 0, pills: TA.pillsNoClaude, body: TA.slot(TA.noClaude("a03.no_claude", { primary: true })) + intro() + G.probe() + startOff() };
    },
    normal: function () {
      return { needs: 4, body: intro() + G.fonts(true) + G.unsaved(false) + G.edited(false) + G.probe() + startOff() };
    },
    focus: function () {
      return { needs: 4, body: intro() + G.fonts(true, true) + G.unsaved(false) + G.edited(false) + G.probe() + startOff() };
    },
    probe: function () { return one("probe"); },
    fonts: function () { return one("fonts"); },
    unsaved: function () { return one("unsaved"); },
    edited: function () { return one("edited"); },
    "edited-confirm": function () {
      return {
        needs: 1, body: intro() + G.edited(false),
        bar: TA.dialog({
          title: t("a03.dialog.title", { item: TA.mono(X.motion) }), changesLabel: t("p13.dialog.changes"),
          changes: [t("a03.dialog.c1"), t("a03.dialog.c2")], backupLabel: t("a03.dialog.backup"), backup: X.aeBackup,
          confirm: t("a03.rebuild"), confirmIcon: "rotate-ccw", keep: t("p13.dialog.keep")
        })
      };
    },
    "no-bridge": function () { var v = one("no_bridge"); v.pills = { host: "unlinked" }; return v; },
    "script-only": function () {
      return {
        needs: 1,
        body: M.steps(["done", "done", "done", "wait", "pend", "pend", "pend"], 3, "warn") + '<div class="mt-4"></div>' +
          G.script_only(true) +
          M.card('<div class="m-row"><div class="t-label m-grow">' + M.mono(X.aep) + '</div>' + M.chip("warn", t("a01.status.unverified"), "triangle-alert") + '</div>', "mt-4")
      };
    },
    "needs-you": function () {
      var item = function (icon, key, btn, primary) {
        return '<div class="m-check">' + M.ico(icon, 16, "ink-accent") + '<div class="m-check-text"><div class="t-body">' + t("a03.need." + key) + '</div>' +
          '<div class="m-row mt-2">' + M.btn(t("a03.need." + key + ".btn"), { kind: primary ? "primary" : "secondary", icon: btn }) + '</div></div></div>';
      };
      return {
        needs: 3,
        body: '<div class="t-title">' + t("a03.needs.title", { item: TA.code(X.motion) }) + '</div>' +
          M.card(item("music", "music", "play", true) + item("hash", "numbers", "file-text") + item("eye", "look", "external-link"), "m-card-flush mt-4")
      };
    },
    success: function () {
      return {
        needs: 0,
        body: TA.slot(M.notice("ok", t("a03.ok", { version: X.aeVersion }))) + M.steps(["done", "done", "done", "run", "pend", "pend", "pend"], 3, "info") +
          '<div class="m-col mt-4">' + M.btn(t("a01.start"), { kind: "primary", block: true, icon: "layers" }) + '</div>'
      };
    },
    offline: function () {
      return { needs: 0, pills: TA.pillsOff, body: TA.slot(TA.offline()) + intro() + startOff() };
    },
    long: function () {
      return { body: intro() + G.fonts(true).replace("Cairo Bold, Tajawal Medium", "Cairo Bold, Tajawal Medium, IBM Plex Sans Arabic SemiBold, Al-Mustaqbal Brand Display") + G.edited(false) + startOff() };
    }
  };

  TA.mount({
    id: "A-03", name: "After Effects gates and Needs-you cards",
    states: ["loading", "normal", "focus", "probe", "fonts", "unsaved", "edited", "edited-confirm", "no-bridge", "script-only", "needs-you", "success", "offline", "no-claude", "long"], defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "home";
      if (v.needs === undefined) v.needs = 1;
      return v;
    }
  }, { ae: true });
})();
</script>
</body>
</html>
