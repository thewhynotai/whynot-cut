<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="normal,normal-live,focus,loading,checking,waiting,timeout,error,error-live,error-nosupport,offline,success,long,win">
<meta name="mock-widths" content="760,640">
<meta name="mock-keys" content="Return: Install Claude (waiting: I've signed in; timeout: Wait more; done: Continue) · Esc: Skip for now · Tab order: I already have Claude (checks again), Skip for now, Install Claude">
<meta name="mock-motion" content="the three 'What happens' rows ARE the progress: each turns from its icon to a spinner to a green check (fill 200 ms) in a fixed row box; the download bar grows inside a reserved block (250 ms width); the sign-in card enters a reserved slot by colour; static fallback: final state">
<title>I-05 Install Claude for me</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/installer.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/installer.js"></script>
<script src="../mockup.js"></script>
<script src="../js/installer.js"></script>
</head>
<body>
<script>
/* I-05 Install Claude for me (screen-inventory §5 I-05; E-T4; the no-Claude path of Addendum G2). Shown after the
   check when facts.claude_found is false (and the sign-in part when Claude is there but signed out).
   Flow: download from claude.ai over HTTPS -> check the publisher (macOS: the app's Apple Team ID; Windows: the
   Authenticode publisher) -> open -> wait for the editor's own sign-in (timeout). The three "What happens" rows are
   the progress rows, so the editor sees each safety step happen.
   G2-r1 (c) answered on screen, with the round-2 owner decisions verbatim: the cost line D-01 (each editor's own Claude
   Pro or Max plan, paid to Anthropic, WhyNot Cut adds nothing; "See plans" opens support.claude.com, which is live);
   video and audio are never uploaded, Claude reads text and a few still images, no telemetry, WhyNot Cut trains on
   nothing (D-03, the approved lines); then the data line D-02 under the privacy lines.
   H24: "Cost and data" (thewhynot.ai/data) shows only in the LIVE state (normal-live: the installer core has
   support.data_url); not live, the D-02 line stands alone. The failure card's support action has two states too:
   live = "Copy details and open support" + the reply promise (D-05), not live = "Copy details for support" (copies
   only) + "Support page coming soon" (error-live shows the live card). [R3: Support (D-05 update 2026-10-16, R3-fix-list S-01): the WhatsApp chat is live, so the support action is "Copy details and open WhatsApp" + the reply promise by default; ?support=off draws the copy-only alternate.]
   NOT in the core yet: the whole step (E-T4).
   E2.1 / G made visible: #3 HTTPS from claude.ai only, the publisher checked, a file that fails is never opened;
   D0.1 the sign-in stays the editor's.
   R2: the title follows the state (Claude isn't installed -> Installing Claude... -> Sign in to Claude -> Claude is ready) and the rail
   step stays on Claude until Continue; the sign-in wait is the pink waiting dot; on a refused file the first button opens
   claude.ai/download, Check again comes after it.
   States: normal, focus, loading (downloading), checking (publisher), waiting (sign in), timeout (no sign-in seen:
   wait more or continue), error (not the genuine app: never opened; what, why, one fix, support), offline (what
   still works + Check again), success, long, win (Windows chrome). */
(function () {
  var t = I.T, D = I.D, st = I.state;
  var url = I.ltr("claude.ai/download");
  function how(o) {
    o = o || {};
    var row = function (kind, icon, text, extra) {
      var ic = kind === "pending" ? I.ico(icon, 16, "ink-muted") : M.status(kind);
      return '<div class="i-step">' + ic + '<div class="i-step-text"><div class="t-body">' + text + "</div>" + (extra || "") + "</div></div>";
    };
    var dlx = o.dlProg ? '<div class="i-step-prog">' + M.progress(o.dlProg) + '<div class="t-meta tx-muted mt-1">' + t("i05.downloading", { done: I.mb(Math.round(1.42 * o.dlProg)), total: I.mb(142) }) + "</div></div>" : "";
    var ckx = o.pub ? '<div class="t-meta tx-muted">' + t("i05.publisher", { name: I.ltr("Anthropic") }) + "</div>" : o.ck === "busy" ? '<div class="t-meta tx-muted">' + t("i05.checking") + "</div>" : "";
    return '<div class="i-sec">' + M.eyebrow(t("i05.how")) + I.list([row(o.dl || "pending", "download", t("i05.how.download"), dlx), row(o.ck || "pending", "shield-check", t("i05.how.check"), ckx), row(o.si || "pending", "log-in", t("i05.how.signin"))], "mt-2") + "</div>";
  }
  function know() {
    return '<div class="i-sec" id="know">' + M.eyebrow(t("i05.know")) + '<div class="m-col mt-2">' +
      I.fact("user-round", t("claude.cost"), { under: M.plansLink() }) + I.fact("lock", t("i05.know.footage")) + I.fact("eye-off", t("i05.know.private")) +
      I.fact("info", t("claude.data"), { under: M.dataLink() }) + "</div></div>";
  }
  /* R2 D-P0-2: the title follows the state: Claude isn't installed -> Installing Claude... -> Sign in to Claude -> Claude is ready.
     The lead and "I already have Claude" only show before the install has started or after it failed. */
  function head(mode) {
    var title = I.titleKey("I-05", I.state); /* R3 I-1: from the one table */
    var intro = !mode;
    return I.title(t(title)) + (intro ? '<div class="i-lead tx-muted mt-2">' + t("i05.text") + "</div>" +
      '<div class="m-row mt-1">' + M.btn(t("i05.have"), { kind: "ghost", icon: "refresh-cw", flush: true }) + "</div>" : "");
  }
  var skip = function (dis) { return I.btn(t("i05.skip"), { kind: "ghost", flush: true, disabled: dis, key: "esc" }); };
  function bar(o) {
    o = o || {};
    return { start: skip(o.busy), end: I.btn(t("i05.install"), { kind: "primary", icon: o.busy ? "busy" : "download", focus: o.focus, key: o.busy ? "" : "enter" }) };
  }
  var card = function (h) { return '<div class="mt-4">' + h + "</div>"; };
  var refused = function () {
    /* R2 D-P1-6: the install path comes first (open the official page), Check again is the step after it */
    return card(I.fail(t("i05.refused"), { safety: true, sub: t("i05.refused.sub", { url: url }),
      btn: I.btn(t("i05.open"), { kind: "primary", icon: "external-link", key: "enter" }) + '<div class="ms-2">' + M.btn(t("i03.again"), { icon: "refresh-cw" }) + "</div>" }));
  };
  var STATES = {
    /* normal (and its live twin) are framed on "Good to know": the cost, privacy, data and link lines are what changed */
    normal: function () { return { body: head() + how() + know(), bar: bar(), scroll: "#know" }; },
    focus: function () { return { body: head() + how() + know(), bar: bar({ focus: true }) }; },
    loading: function () { return { body: head("run") + how({ dl: "busy", dlProg: 44 }) + know(), bar: bar({ busy: true }) }; },
    checking: function () { return { body: head("run") + how({ dl: "ok", ck: "busy" }) + know(), bar: bar({ busy: true }) }; },
    waiting: function () {
      return {
        body: head("signin") + card(I.act("waiting", t("i05.signin"), "", { icon: "log-in", btns: I.btn(t("i05.signed"), { kind: "primary", key: "enter" }) })) +
          how({ dl: "ok", ck: "ok", pub: true, si: "waiting" }) + know(),
        bar: { start: skip() }
      };
    },
    timeout: function () {
      return {
        body: head("signin") + card(I.act("warn", t("i05.timeout"), t("i05.timeout.sub"), { btns: I.btn(t("i05.wait"), { kind: "primary", icon: "refresh-cw", key: "enter" }) + '<div class="ms-2">' + M.btn(t("i05.without"), {}) + "</div>" })) +
          how({ dl: "ok", ck: "ok", pub: true, si: "warn" }) + know(),
        bar: { start: skip() }
      };
    },
    error: function () { return { body: head() + refused() + how({ dl: "ok", ck: "error" }), rail: "error", bar: { start: skip() } }; },
    offline: function () {
      return {
        body: head() + card(I.notice("warn", t("i05.offline", { url: url }), { dismiss: false, btn: { label: t("i03.again"), primary: true, icon: "refresh-cw" } })) + how() + know(),
        bar: { start: skip(), end: M.btn(t("i05.install"), { disabled: true, icon: "download" }) }
      };
    },
    success: function () {
      return {
        body: head("ready") + card(M.notice("ok", t("i03.claude.ok"), { dismiss: false })) + how({ dl: "ok", ck: "ok", pub: true, si: "ok" }) + know(),
        rail: "ok", bar: { end: I.btn(t("i00.continue"), { kind: "primary", key: "enter" }) }
      };
    },
    long: function () { return { body: head() + refused() + how({ dl: "ok", ck: "error" }) + know(), rail: "error", bar: { start: skip() }, scroll: "end" }; },
    win: function () { return { body: head() + how() + know(), bar: bar() }; }
  };
  I.mount({
    id: "I-05", name: "Install Claude for me",
    states: ["normal", "normal-live", "focus", "loading", "checking", "waiting", "timeout", "error", "error-live", "error-nosupport", "offline", "success", "long", "win"], defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      var mark = v.rail === "error" ? "error" : (state === "loading" || state === "checking") ? "busy" : state === "waiting" ? "waiting" : state === "timeout" ? "warn" : undefined;
      /* R2 D-P0-2: the Claude step in the rail stays active until Continue, also when Claude is ready */
      v.rail = { flow: "install", at: "claude", claude: true, mark: mark };
      return v;
    }
  });
})();
</script>
</body>
</html>
