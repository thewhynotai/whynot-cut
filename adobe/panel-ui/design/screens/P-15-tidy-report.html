<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="loading,normal,focus,podcast,sync-running,sync-done,error,offline,no-claude,long">
<meta name="mock-keys" content="Mod+Enter = the one primary (Done; Sync the podcast by sound in Podcast mode; Open the synced sequence after a sync). Undo is a secondary with no keycap, so a habitual Mod+Enter never reverses the work; Esc = Stop while syncing, else close the top notice; Alt+1 / Alt+2 / Alt+3 = tabs; Tab / Shift+Tab reading order. No single-key shortcuts.">
<meta name="mock-motion" content="Controls: background and border colour 150 ms ease (--mk-ease); focus = border colour only, no layout shift. Notices appear in a reserved slot, background colour 200 ms. Skeleton shimmer 1200 ms linear; static fallback = solid #242424 bars. Progress fill width 250 ms; the n-of-m text always carries the value. Every state is complete with no motion. Report counts appear at once (no count-up animation).">
<title>P-15 Tidy report, undo and podcast sync</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/tools-ae.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/tools-ae.js"></script>
<script src="../mockup.js"></script>
<script src="../js/tools-ae.js"></script>
</head>
<body>
<script>
/* P-15 Tidy: report, undo and podcast sync (screen-inventory.md §3 P-15; FR-15 undo = open the backup; FR-19..23 and
   A3.7 sync: one "<project> - Synced" sequence, a clip with no clear sound match is left out and named). Tools tab.
   - normal (Reels): the report, then the pre-clean copy with Undo as a secondary (no keycap); Done is the violet (R2).
   - podcast: the report, then the sync card; "Sync the podcast by sound" is the primary, Done and Undo are secondary.
   - sync-running: per-clip progress with Stop. sync-done: the synced sequence + the left-out clip and why.
   - error: one clip could not be exported; it is left out and named, the rest continues.
   - offline: the undo still works (it opens a file in Premiere); sync is disabled. Loading = applying.
   - Empty and stale: not applicable. focus: keyboard focus on the undo. long: long project and backup names. */
(function () {
  var t = M.t, D = M.D, X = D.ta;

  function head() { return M.back(t("p13.back")) + TA.title("folder-tree", t("home.tool.tidy"), M.ltr("Tidy")); }
  /* one set of numbers (R2-fix-list 1.2): 112 were planned, 4 turned out to be in use and stay, so 108 were removed;
     214 moved into 4 bins that add up to 214; 2 nests renamed; 7 empty bins removed */
  function counts() {
    return M.card('<div class="t-label">' + t("p15.counts") + '</div>' +
      '<div class="mt-2">' + M.saved(t("p15.value")) + '</div><div class="mt-2">' + TA.stats([[M.ltr("214"), t("p15.moved")], [M.ltr("108"), t("p15.removed")], [M.ltr("2"), t("p15.renamed")], [M.ltr("7"), t("p15.bins")]]) + '</div>' +
      TA.row(M.status("info"), t("p15.skipped", { s: 4, r: 112 }), "mt-3"), "mt-4");
  }
  function where() {
    return M.card('<div class="t-label">' + t("p15.where") + '</div><div class="m-col mt-1">' + X.bins.map(function (b) {
      return '<div class="m-row" style="min-height:32px">' + M.ico("folder", 16, "ink-muted") +
        '<div class="t-mono ms-2 m-grow">' + M.path(b[0]) + '</div>' + M.chip("neutral", M.ltr(String(b[1]))) + '</div>';
    }).join(M.divider()) + '</div>', "mt-4");
  }
  /* Undo is a secondary with no keycap: right after success the violet is Done, so a habitual Mod+Enter never reverses the work.
     R3 (designer F-22): at its own width, start-aligned, so the grey card is never bigger than the violet Done. */
  function undoCard(o) {
    o = o || {};
    return M.card('<div class="m-row">' + M.ico("undo-2", 16, "ink-muted") + '<div class="t-label ms-2 m-grow">' + t("p15.backup.title") + '</div></div>' +
      '<div class="mt-2">' + TA.name(o.backup || X.tidyBackup) + '</div>' +
      '<div class="t-meta tx-muted mt-2">' + t("p15.undo.hint") + '</div>' +
      '<div class="m-row mt-3">' + M.btn(t("action.undo"), { kind: "secondary", icon: "undo-2", focus: o.focus, cls: "m-needs-host" }) + '</div>' +
      '<div class="m-row mt-2">' + M.btn(t("p15.reveal"), { kind: "ghost", icon: "folder-open", flush: true }) + '</div>', "mt-4");
  }
  function syncCard(o) {
    o = o || {};
    var inner;
    if (o.running) {
      inner = TA.progress(t("p15.sync.progress", { n: 3, of: 8, name: TA.mono("Cam 2 – A003.mov") }), 38, t("p13.elapsed", { t: M.html(M.mono("00:41")) }), t("p13.stop"));
    } else {
      inner = '<div class="t-meta tx-muted">' + t("p15.sync.sub") + '</div>' +
        TA.row(M.status("ok"), t("p15.sync.found", { c: 3, m: 5 })) +
        '<div class="m-col mt-3">' + M.btn(t("p15.sync"), { kind: "primary", block: true, icon: "audio-lines", disabled: o.disabled }) + '</div>';
    }
    return M.card('<div class="m-row">' + M.ico("audio-lines", 16, "ink-muted") + '<div class="t-label ms-2 m-grow">' + t("p15.sync.title") + '</div></div><div class="mt-2">' + inner + '</div>', "mt-4");
  }
  /* 8 clips: 7 placed with Mic 3 left out (no clear match); in the error state Cam 3 is also left out, so 6 placed */
  function syncDone(o) {
    o = o || {};
    var name = X.projectName + " - Synced";
    return M.card('<div class="m-row-top">' + M.status("ok") + '<div class="t-label ms-2 m-grow">' + t("p15.sync.done", { name: TA.mono(name) }) + '</div></div>' +
      '<div class="t-meta tx-muted mt-1">' + t("p15.sync.placed", { n: o.placed || 7, of: 8 }) + '</div>' +
      '<div class="ta-srow mt-3">' + M.status("warn") + '<div class="m-col ms-2 m-grow"><div class="t-meta tx-text">' + t("p15.sync.skipped", { name: TA.mono("Mic 3 – ZOOM0004.wav") }) + '</div>' +
      '<div class="t-meta tx-muted">' + t("p15.sync.skip_hint") + '</div></div></div>' +
      '<div class="m-col mt-3">' + M.btn(t("p15.open_seq"), { kind: "primary", block: true, icon: "film" }) + '</div>', "mt-4");
  }
  /* Done is the screen's violet unless a card above already carries the next step */
  function done(o) {
    o = o || {};
    return '<div class="ta-btnrow mt-4">' + M.btn(t("p13.done"), { kind: o.primary === false ? "secondary" : "primary" }) + '</div><div class="mt-2">' + M.supportRow({ flush: true }) + '</div>';
  }
  function okNotice() { return M.slot(M.notice("ok", t("p15.done"))); }

  var STATES = {
    loading: function () {
      return {
        body: head() + M.card(TA.progress(t("p15.applying", { n: 168, of: 335 }), 50, t("p13.elapsed", { t: M.html(M.mono("00:12")) }), ""), "mt-4") +
          M.card(M.skel(40) + '<div class="mt-2"></div>' + M.skel(90, 28) + M.skel(90, 28), "mt-4")
      };
    },
    normal: function () { return { body: okNotice() + head() + counts() + where() + undoCard() + done() }; },
    "no-claude": function () { return { pills: TA.pillsNoClaude, body: TA.noClaude("p13.no_claude.solo", { solo: true }) + head() + counts() + where() + undoCard() + done() }; },
    focus: function () { return { body: okNotice() + head() + counts() + where() + undoCard({ focus: true }) + done() }; },
    podcast: function () { return { body: okNotice() + head() + counts() + syncCard() + undoCard() + done({ primary: false }) }; },
    "sync-running": function () { return { body: head() + syncCard({ running: true }) + counts() + undoCard() }; },
    "sync-done": function () { return { body: head() + syncDone() + counts() + undoCard() + done({ primary: false }) }; },
    error: function () {
      return {
        body: M.slot(M.notice("warn", t("p15.error", { name: TA.mono("Cam 3 – C0007.mp4") }), { sub: t("p15.error.hint"), btn: { label: t("p15.retry_clip"), icon: "refresh-cw" } })) +
          head() + syncDone({ placed: 6 }) + counts() + undoCard() + done({ primary: false })
      };
    },
    offline: function () {
      return {
        pills: TA.pillsAppOff,
        body: TA.partialOffline("p15.offline.hint") + head() + counts() + undoCard() + syncCard({ disabled: true }) + done()
      };
    },
    long: function () { return { body: okNotice() + head() + counts() + undoCard({ backup: X.long.tidyBackup }) + done() }; }
  };

  TA.mount({
    id: "P-15", name: "Tidy report, undo and podcast sync",
    states: ["loading", "normal", "focus", "podcast", "sync-running", "sync-done", "error", "offline", "no-claude", "long"], defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "tools";
      if (v.needs === undefined) v.needs = 0;
      return v;
    }
  });
})();
</script>
</body>
</html>
