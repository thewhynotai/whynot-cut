<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="checksum,manifest,address,dlfail,nointernet,diskfull,panel,hostopen,focus,long,win">
<meta name="mock-widths" content="760,640">
<meta name="mock-keys" content="Return: the card's one fix (Try again / Check again / Show me) · Esc: Close · S: Save a report for support · Tab order: fix, Contact support, Save a report for support, Show details, Close">
<meta name="mock-motion" content="the card enters a reserved slot above the list by colour (200 ms); the stopped row turns red by fill colour in place; on Try again the fix button shows a spinner with its width locked; static fallback: final state">
<title>I-07 Failure cards</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/installer.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/installer.js"></script>
<script src="../mockup.js"></script>
<script src="../js/installer.js"></script>
</head>
<body>
<script>
/* I-07 Security and failure cards (screen-inventory §5 I-07; E2.1#3, #4, E-T7, F7, B4.4; Addendum G10 fault list).
   Every installer failure as: what happened (one white sentence), why (one meta line), ONE fix button, then Contact
   support + Save a report for support (G2-r1 e), the privacy note and the log path; never a stack trace, never a
   developer word. Shown over the I-04 checklist: the stopped row is red; what is done stays.
   Data: the core's red/amber StepResult {name, status, detail, needs_you} and the log path; the safety cards need
   E-T3 (a signed list of files with an allowlist of addresses). Today the core refuses a mismatched or unpinned
   download (it names the file and the log) but has no address allowlist and no list signature. "Download failed"
   and resume-from-where-it-stopped need the core's partial-download support. The support link comes from config
   (D.support).
   States: one per card (checksum = not the genuine file, manifest = list not genuine, address = not on our list,
   dlfail = download stopped halfway, nointernet, diskfull, panel = Adobe did not install the panel, hostopen =
   Premiere still open: save first), focus (keyboard on the fix), long (the panel card with a long file name),
   win (Windows chrome, the download page). R2: no file names, no log path and no script address in a card; nointernet offers
   "Get the offline installer"; support is one click (MOCK-VERIFY, owner decision D-05). */
(function () {
  var t = I.T, D = I.D, st = I.state, win = I.os === "win";
  var KEYS = ["preflight", "engine", "claude"].concat(win ? ["gitbash"] : []).concat(["adobe", "fonts", "always_on", "models", "client", "doctor", "launch"]);
  var N = KEYS.length;
  function rows(stop, kind) {
    var at = KEYS.indexOf(stop);
    return I.list(KEYS.map(function (key, i) {
      return i < at ? I.step("ok", t("i04.step." + key), { end: t("i04.end.done") })
        : i === at ? I.step(kind || "error", t("i04.step." + key), { end: kind === "warn" ? t("i04.end.you") : "" })
        : I.step("pending", t("i04.step." + key));
    }), "mt-4");
  }
  var fix = function (label, icon, f) { return I.btn(label, { kind: "primary", icon: icon, focus: f, key: "enter" }); };
  var C = {
    checksum: { stop: "engine", card: function (f) { return I.fail(t("i07.checksum"), { safety: true, sub: t("i07.checksum.sub"), btn: fix(t("i00.retry"), "refresh-cw", f) }); } },
    manifest: { stop: "preflight", card: function (f) { return I.fail(t("i07.manifest"), { safety: true, sub: t("i07.manifest.sub"), mono: D.downloadPage, btn: fix(t("i07.manifest.btn"), "external-link", f) }); /* R2 D-P1-6: open the page, never copy a script address */ } },
    address: { stop: "engine", card: function (f) { return I.fail(t("i07.address"), { safety: true, sub: t("i07.address.sub", { host: I.path(D.badHost) }), btn: fix(t("i00.retry"), "refresh-cw", f) }); } },
    dlfail: { stop: "engine", card: function (f) { return I.fail(t("i07.dlfail"), { sub: t("i07.dlfail.sub"), btn: fix(t("i00.retry"), "refresh-cw", f) }); } },
    nointernet: { stop: "engine", card: function (f) { return I.fail(t("i07.nointernet"), { kind: "warn", sub: t("i07.nointernet.sub"), btn: fix(t("i00.retry"), "refresh-cw", f) + '<div class="ms-2">' + M.btn(t("i00.offline_get"), { icon: "external-link" }) + "</div>" }); } },
    diskfull: { stop: "models", card: function (f) { return I.fail(t("i07.diskfull", { gb: I.gb(2.5) }), { sub: t("i07.diskfull.sub", { free: I.gb(0.4), drive: I.ltr(D.drive) }), btn: fix(t("i00.check_again"), "refresh-cw", f) }); } },
    panel: { stop: "adobe", kind: "warn", card: function (f) { return I.fail(t("i07.panel"), { kind: "warn", mono: D.ccx, btn: fix(t("i07.panel.btn"), "file-search", f) }); } },
    hostopen: { stop: "adobe", kind: "warn", card: function (f) { return I.fail(t("i07.hostopen"), { kind: "warn", sub: t("i07.hostopen.sub"), btn: fix(t("i00.check_again"), "refresh-cw", f) }); } }
  };
  function view(key, focus) {
    var c = C[key], n = KEYS.indexOf(c.stop);
    return {
      body: '<div class="i-title">' + t("i07.title") + "</div>" + (n ? '<div class="t-meta tx-muted mt-1">' + t("i07.done", { n: n, of: N }) + "</div>" : "") +
        '<div class="mt-3">' + c.card(focus) + "</div>" + rows(c.stop, c.kind),
      bar: { start: M.btn(t("i04.details"), { kind: "ghost", icon: "scroll-text", flush: true }), end: I.btn(t("i00.close"), { key: "esc" }) },
      mark: c.kind === "warn" ? "warn" : "error"
    };
  }
  I.mount({
    id: "I-07", name: "Failure cards",
    states: ["checksum", "manifest", "address", "dlfail", "nointernet", "diskfull", "panel", "hostopen", "focus", "long", "win"], defaultState: "checksum",
    build: function (state) {
      var v;
      if (state === "focus") v = view("checksum", true);
      else if (state === "long") { v = view("panel"); v.scroll = "end"; } /* the long Arabic / space file name (I.useLong) */
      else if (state === "win") v = view("manifest");
      else v = view(state);
      v.rail = { flow: "install", at: "install", mark: v.mark };
      return v;
    }
  });
})();
</script>
</body>
</html>
