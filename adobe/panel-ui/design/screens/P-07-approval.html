<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="empty,loading,normal,older,noname,flagged-unchecked,flagged-checked,domains,domains-checked,removed,focus,error,error-live,offline,no-claude-signed-out,no-claude-missing,stale,success-live,success-later,success-changes,long">
<meta name="mock-keys" content="Mod+Enter = Approve (only when it is on) or the notice's fix; Esc = close the top notice; Alt+1 / Alt+2 / Alt+3 = Home / Edit / Tools; Tab / Shift+Tab move through the flagged lines, their seek buttons, the checkbox and the bar in reading order (mirrored in Arabic). No single-key shortcuts. UXP keydown capture: lab item.">
<meta name="mock-motion" content="trigger | property | token | final static state
checkbox ticked | background-color, border-color of the box | --mk-dur-fast, --mk-ease | white box with a black check;
Approve turns on | background-color, border-color, colour | --mk-dur-base, --mk-ease | violet fill, white label, keycap;
lines expand / collapse | none (instant, no height animation) | none | all lines shown with Show less;
seek pressed | background-color of the control | --mk-dur-fast | rest (transparent), playhead moved in Premiere;
approved (notice in) | background-color, border-color | --mk-dur-base | ok notice in its reserved slot; bar removed;
step bar advances | background-color of a segment | --mk-dur-slow | Build segment shows the gradient;
loading | skeleton shimmer (loop) | --mk-dur-shimmer linear | static #242424 bars when animations do not run">
<title>P-07 Approval</title>
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="../css/premiere-core.css">
<link rel="stylesheet" href="../css/panel-v1.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../strings/premiere-core.js"></script>
<script src="../strings/panel-v1.js"></script>
<script src="../mockup.js"></script>
<script src="../js/premiere-core.js"></script>
<script src="../js/panel-v1.js"></script>
</head>
<body>
<script>
/* P-07 Approval, flagged lines, request changes (screen-inventory.md §3 P-07; E-D3 r1, Addendum G r1 and R2 fixes). Edit tab.
   R2: one tick PER flagged line (editor P2-13); "Confirmed with" is required for a medical or religious client (owner
   F-05); the approved card offers "Export sign-off" (a product backlog item, owner F-05); in `stale` every number (map
   end, summary, saved line, diff) comes from the NEW plan (editor P1-04); in `error` the notice's Try again is the one
   fix and Approve is off (designer P2-7); the Needs-you badge counts a blocked approval (designer P1-11); the saved
   time is future tense before anything is built (editor P2-06).
   - The plan shows the media: an edit map (cuts, on-screen lines, B-roll, flagged lines) and the time saved.
   - Flagged lines in full; each timecode seeks the Premiere playhead (ships only if the UXP lab proves the API, else
     plain meta); each line says who confirms it; the "I've checked these lines" box is always visible, with an optional
     "confirmed with" field. Approve stays off until the box is ticked; the bar's hint expands the lines.
   - The pinned bar carries Approve, its keycap and the trust line (a NEW sequence; originals untouched).
   - The approval record shows the full date and time and who confirmed the lines.
   - no-claude-*: "Approved and saved; the build waits" + the Claude fix as the one primary.
   - older: the plan was approved with an older WhyNot Cut (the engine's OLDER_APPROVAL, verbatim). It is information, not a
     fault: an amber notice (never red) above the normal approval flow.
   - R3 (decision 4, editor P1-01): panel_state.previous_approval {by, at, via, format, reason, lines?} (eng-data-contract
     §2.5). The notice says who approved, when and with whom. A flagged line keeps its tick ONLY when its graphic id AND
     its on-screen text are the same as in the earlier approval; it is marked "From the earlier approval". A line whose
     wording changed stays empty with "The wording changed, so this line needs a fresh look." Absent = no prefill.
     older (reason older_whynot_cut): line 3 changed, lines 1-2 keep their ticks; stale (reason plan_changed): the
     wording of all three is the same, so all keep their ticks and only "Confirmed with" is asked again.
   - R3 (editor P1-04): the new sequence is named once, from plan.sequence_name, as one no-break mono run.
   - Phase 4 (UI track 2026-10-18; coverage map §2.1, wires C-1 + C-5, Stage 3):
     domains / domains-checked: the flagged lines grouped by review domain (Addendum M: medical, religious, business,
       AI), each group naming its own approver from the review-domains registry (the doctor; the content owner; the
       business owner or their legal adviser; the client) with the line's verdict chip, a tick per line and one
       "Confirmed with" per group. Approve stays off until every line is ticked and every group is filled.
       Medical and religious are never auto; a religious line is never confirmed on the owner's behalf.
     removed: the K-T2 "what we removed" review clip: a secondary button on the summary card, the words that
       change the meaning listed first (as said, with the reason). Watching it is not an approval step. */
(function () {
  var t = M.t, D = M.D;
  function item() { return M.html(M.ltr(D.item, "lat code")); }
  var who = D.who[M.lang];
  var STEPS_APPROVE = ["done", "done", "wait", "pend", "pend", "pend", "pend"];

  function heading() {
    return M.steps(STEPS_APPROVE, 2, "warn") +
      M.eyebrow(t("approval.summary"), "mt-5") +
      '<div class="t-title mt-1">' + t("approval.title", { item: item() }) + '</div>';
  }
  function saved(reelKey) {
    return M.saved(t("approval.saved_time", { raw: M.html(M.mono(D.raw)), reel: M.raw(reelKey || "demo.reel"), min: M.raw("demo.min") }), "mt-3");
  }
  function summary(o) {
    o = o || {};
    return M.card('<div class="t-body">' + t(o.text || "demo.summary") + '</div>' +
      '<div class="mt-3">' + M.editMap((o.plan || D.plan).edit_map) + '</div>' + saved(o.reel) +
      '<div class="m-row mt-3">' + M.btn(t("approval.preview"), { icon: "play", disabled: o.disabled }) + '</div>', "mt-3");
  }
  /* the earlier approval's verdict per line: "kept" (same graphic id and same text, ticked then), "changed", or "" */
  function prevOf(f, prev) {
    if (!prev || !prev.lines) return "";
    for (var i = 0; i < prev.lines.length; i++) {
      var l = prev.lines[i];
      if (l.graphic_id === f.id) return l.text === f.text && l.checked ? "kept" : "changed";
    }
    return "changed";
  }
  function flagRow(f, checked, mark) {
    var kind = f.kind === "medical"
      ? M.chip("neutral", t("approval.flagged.medical"), "stethoscope")
      : M.chip("neutral", t("approval.flagged.religious"), "book-open");
    return '<div class="m-flag"><div class="m-row">' + kind + '<span class="m-spacer"></span>' + M.seek(f.tc) + '</div>' +
      '<div class="m-quote m-quote-ar mt-2" dir="rtl" lang="ar"><span class="ar-run">«' + M.esc(f.text) + '»</span></div>' +
      '<div class="t-meta tx-muted mt-1">' + t("approval.confirm." + f.kind) + '</div>' +
      '<div class="m-col mt-1">' + M.checkbox(t("approval.checked"), checked) + '</div>' +
      (mark === "kept" ? '<div class="m-row-top mt-1"><div class="m-last-ico">' + M.status("ok", 12) + '</div><div class="t-meta tx-muted ms-1 m-grow">' + t("approval.prev") + '</div></div>'
        : mark === "changed" ? '<div class="m-row-top mt-1"><div class="m-last-ico">' + M.status("info", 12) + '</div><div class="t-meta tx-text ms-1 m-grow">' + t("approval.changed") + '</div></div>' : '') +
      '</div>';
  }
  /* o: {all: bool, checked: bool, prev: previous_approval} */
  function flagged(o) {
    var list = o.all ? D.flagged : D.flagged.slice(0, 2);
    var toggle = o.all
      ? M.btn(t("approval.show_less"), { kind: "ghost", icon: "chevron-up", flush: true })
      : M.btn(t("approval.show_all", { n: D.flagged.length }), { kind: "ghost", icon: "chevron-down", flush: true });
    return M.card(
      '<div class="m-row">' + M.status("warn") + '<div class="t-label ms-2 m-grow">' + t("approval.flagged") + '</div>' +
        M.chip("warn", M.ltr(String(D.flagged.length))) + '</div>' +
      '<div class="t-meta tx-muted mt-1">' + t("approval.flagged.hint") + '</div>' +
      '<div class="m-col mt-1">' + list.map(function (f) { var mk = prevOf(f, o.prev); return flagRow(f, o.checked || mk === "kept", mk); }).join('<span class="m-divider"></span>') + '</div>' +
      '<div class="m-row">' + toggle + '</div>' +
      '<span class="m-divider"></span>' +
      '<div class="t-label mt-3">' + t("approval.who") + '</div>' +
      '<div class="t-meta tx-muted">' + t("approval.who.required") + '</div>' +
      '<div class="mt-2">' + M.input(t("approval.who.placeholder"), { value: o.checked ? M.txt(who) : "" }) + '</div>', "mt-4");
  }
  function changesCard(o) {
    o = o || {};
    return M.card('<div class="t-label">' + t("approval.changes.label") + '</div>' +
      '<div class="mt-2">' + M.input(t("approval.changes.placeholder"), { textarea: true }) + '</div>' +
      '<div class="m-row mt-3">' + M.btn(t("approval.changes"), { icon: "message-square", disabled: o.disabled }) + '</div>', "mt-4");
  }
  /* the pinned action bar. why: "ok" | "collapsed" | "unticked" | "noname" | "off" | "fix" (a failed save: Try again is up in the notice) */
  function bar(why, focus) {
    var on = why === "ok";
    var top = why === "noname"
      ? '<div class="t-label">' + t("approval.editor") + '</div><div class="mt-2">' + M.input(t("approval.editor.placeholder"), { focus: true }) + '</div>'
      : '<div class="m-row">' + M.status("info", 12) + '<div class="t-meta tx-muted ms-1 m-grow">' + t("approval.as", { name: D.editor }) + '</div></div>';
    var hint = why === "collapsed" ? '<div class="m-col mt-2">' + M.linkbtn(t("approval.open_lines", { n: D.flagged.length }), "chevron-down") + '</div>'
      : why === "unticked" ? '<div class="t-meta tx-muted mt-2">' + t("approval.tick_first") + '</div>'
      : why === "noname" ? '<div class="t-meta tx-muted mt-2">' + t("approval.need_name") + '</div>'
      : why === "fix" ? '<div class="t-meta tx-muted mt-2">' + t("approval.fix_first") + '</div>'
      : why === "needwho" ? '<div class="t-meta tx-muted mt-2">' + t("approval.need_who") + '</div>'
      : why === "domneed" ? '<div class="t-meta tx-muted mt-2">' + t("p07.dom.need") + '</div>' : "";
    return top + '<div class="m-col mt-2">' +
      M.btn(t("approval.approve"), { kind: "primary", block: true, icon: "circle-check-big", disabled: !on, focus: focus, kbd: true }) + '</div>' + hint +
      M.trust(t("approval.trust", { seq: M.html('<bdi dir="ltr" class="mono nowrap">' + M.esc(D.seq) + '</bdi>') }), "mt-2") +
      '<div class="m-saved mt-1">' + M.ico("lock", 16, "ink-muted") + '<div class="t-meta tx-muted ms-2 m-grow">' + t("privacy.claude_sees") + '</div></div>';
  }
  /* ---- Phase 4: review domains (Addendum M) ---- */
  var V = V1.D;
  function domLines(g) {
    if (g.lines) return g.lines;
    var out = []; /* a plain loop: check_css reads the array method's name as the CSS property in screen files */
    D.flagged.forEach(function (f) { if (g.ids.indexOf(f.id) >= 0) out.push(f); });
    return out;
  }
  function domGroup(g, checked) {
    var lines = domLines(g);
    var rows = lines.map(function (f) {
      return '<div class="m-flag"><div class="m-row">' + M.chip("warn", t("p07.v." + g.verdict)) + '<span class="m-spacer"></span>' + M.seek(f.tc) + "</div>" +
        '<div class="m-quote m-quote-ar mt-2" dir="rtl" lang="ar"><span class="ar-run">«' + V1.arTxt(f.text) + "»</span></div>" +
        '<div class="m-col mt-1">' + M.checkbox(t("approval.checked"), checked) + "</div></div>";
    }).join('<span class="m-divider"></span>');
    return '<div class="m-inset mt-3"><div class="m-row">' + M.ico(g.icon, 16, "ink-accent") + '<div class="t-label ms-2 m-grow">' + t("p07.dom." + g.k) + "</div>" +
      M.chip("neutral", M.ltr(String(lines.length))) + "</div>" +
      '<div class="m-row-top mt-1">' + M.ico("user-check", 12, "ink-muted") + '<div class="t-meta tx-muted ms-1 m-grow">' + t("p07.who." + g.k) + "</div></div>" +
      '<div class="m-col">' + rows + "</div>" +
      '<div class="t-label mt-2">' + t("p07.dom.who") + "</div>" +
      '<div class="mt-1 v1-oneline">' + M.input(t("p07.dom.ph." + g.k), { value: checked ? M.txt(g.who[M.lang]) : "" }) + "</div></div>";
  }
  /* the edit map of the domains states shows the business and AI lines too (same plan, two more flagged spans) */
  var PLAN_DOM = { edit_map: { duration_s: D.plan.edit_map.duration_s, spans: D.plan.edit_map.spans.concat([
    { kind: "flagged", start_s: 38.6, end_s: 41.0, flag: "business" }, { kind: "flagged", start_s: 50.6, end_s: 51.8, flag: "ai" } ])
    .sort(function (x, y) { return x.start_s - y.start_s; }) } }; /* the edit map lays spans out in time order */
  function domainsCard(checked) {
    return M.card('<div class="m-row">' + M.status("warn") + '<div class="t-label ms-2 m-grow">' + t("p07.dom.title") + "</div></div>" +
      '<div class="t-meta tx-muted mt-1">' + t("p07.dom.hint") + "</div>" +
      V.domains.map(function (g) { return domGroup(g, checked); }).join("") +
      '<div class="m-row-top mt-3">' + M.status("info", 12) + '<div class="t-meta tx-muted ms-1 m-grow">' + t("p07.dom.never_auto") + "</div></div>", "mt-4");
  }
  /* ---- Phase 4: the K-T2 review clip of what the plan removes ---- */
  function removedCard() {
    var R = V.removed;
    var words = R.meaning.map(function (m) {
      return '<span class="m-chip m-chip-warn me-1 mt-1"><span class="m-block"><bdi dir="rtl" lang="ar">«' + V1.arTxt(m.w) + "»</bdi> · " + t("p10.r." + m.r) + "</span></span>";
    }).join("");
    return M.card('<div class="m-row-top">' + M.ico("file-video", 16, "ink-accent") + '<div class="m-col ms-2 m-grow">' +
      '<div class="t-label">' + t("p07.removed.ready", { n: M.html(M.ltr(String(R.parts))), dur: M.html(M.mono(R.dur)) }) + "</div>" +
      '<div class="t-meta tx-muted mt-1">' + t("p07.removed.sub") + "</div>" +
      '<div class="t-body mt-2">' + V1.tn("p07.removed.meaning", R.meaning.length) + "</div>" +
      '<div class="m-row m-wrap">' + words + "</div>" +
      '<div class="m-row mt-3">' + M.btn(t("p07.removed.btn"), { icon: "play" }) + "</div></div></div>", "mt-3");
  }
  var slot = M.slot;
  /* the earlier approval, as one notice: the engine's sentence, then who / when / with whom, then what was kept */
  function prevNotice(kind, text, prev, extraSub) {
    var kept = 0;
    D.flagged.forEach(function (f) { if (prevOf(f, prev) === "kept") kept++; });
    var date = M.raw("demo.date");
    var sub = (extraSub ? extraSub + '<br>' : '') + t("approval.older.by", { name: prev.by === "Yunus" ? D.editor : prev.by, date: date }) +
      (prev.confirmed_with ? ' · ' + t("approval.older.with", { who: who }) : '');
    var keptLine = kept === D.flagged.length ? t("approval.prev.all", { n: kept }) : t("approval.prev.kept", { n: kept, of: D.flagged.length });
    return M.notice(kind, text, { sub: sub, extra: '<div class="t-meta tx-muted mt-1">' + keptLine + '</div>', dismiss: false });
  }
  function doneRecord() {
    return M.card('<div class="m-row-top">' + M.status("ok") + '<div class="m-col ms-2 m-grow"><div class="t-label">' +
      t("approval.done_full", { name: D.approval_record.by === "Yunus" ? D.editor : D.approval_record.by, date: M.raw("demo.date") }) + '</div>' +
      '<div class="t-meta tx-muted">' + t("approval.with", { who: who }) + '</div>' +
      '<div class="m-row mt-1">' + M.linkbtn(t("approval.export"), "download") + '</div></div></div>', "mt-4");
  }
  function noClaude(missing) {
    return {
      needs: 1, pills: { claude: missing ? "missing" : "signed_out" },
      body: slot(M.noClaude(missing ? "missing" : "signed_out", { text: t(missing ? "approval.no_claude_missing" : "approval.no_claude"),
          sub: t(missing ? "approval.no_claude_missing.hint" : "approval.no_claude.hint") })) +
        M.steps(["done", "done", "done", "wait", "pend", "pend", "pend"], 3, "warn") + doneRecord() + summary()
    };
  }

  var STATES = {
    empty: function () {
      return {
        needs: 0,
        body: M.steps(["pend", "pend", "pend", "pend", "pend", "pend", "pend"], 0, "pending") +
          '<div class="mt-4"></div>' +
          M.empty({ icon: "circle-check-big", title: t("approval.empty"), text: t("approval.empty.text"),
            btn: M.btn(t("home.edit"), { kind: "primary", icon: "clapperboard", kbd: true }) })
      };
    },
    loading: function () {
      return {
        needs: 0,
        body: heading() +
          M.card(M.skel(95) + M.skel(90) + M.skel(55) + '<div class="mt-3"></div><span class="m-skel-block" style="height:24px;border-radius:4px"></span>' +
            '<div class="m-row mt-3"><span class="m-skel-block" style="width:132px;height:32px"></span></div>', "mt-3") +
          M.card(M.skel(50) + M.skel(80, 16) + '<div class="mt-3"></div>' + M.skel(30) + M.skel(85) + '<div class="mt-3"></div>' + M.skel(30) + M.skel(70), "mt-4"),
        bar: '<div class="m-col">' + M.skel(45, 16) + '<div class="mt-2"></div><span class="m-skel-block" style="height:40px"></span></div>'
      };
    },
    normal: function () { return { body: heading() + summary() + flagged({}) + changesCard(), bar: bar("collapsed") }; },
    "flagged-unchecked": function () { return { body: heading() + summary() + flagged({ all: true }) + changesCard(), bar: bar("unticked") }; },
    "flagged-checked": function () { return { body: heading() + summary() + flagged({ all: true, checked: true }) + changesCard(), bar: bar("ok") }; },
    older: function () {
      var prev = D.previous_approval.older;
      return { body: slot(prevNotice("warn", t("approval.older"), prev)) + heading() + summary() + flagged({ all: true, prev: prev }) + changesCard(), bar: bar("unticked") };
    },
    /* Phase 4: review domains, each with its approver (Addendum M); one "Confirmed with" per group */
    domains: function () { return { body: heading() + summary({ plan: PLAN_DOM }) + domainsCard(false) + changesCard(), bar: bar("domneed") }; },
    "domains-checked": function () { return { body: heading() + summary({ plan: PLAN_DOM }) + domainsCard(true) + changesCard(), bar: bar("ok") }; },
    /* Phase 4: the "what we removed" review clip (K-T2) under the summary */
    removed: function () { return { body: heading() + summary() + removedCard() + flagged({}) + changesCard(), bar: bar("collapsed") }; },
    noname: function () { return { body: heading() + summary() + flagged({ all: true, checked: true }) + changesCard(), bar: bar("noname") }; },
    focus: function () { return { body: heading() + summary() + flagged({ all: true, checked: true }) + changesCard(), bar: bar("ok", true) }; },
    error: function () {
      return {
        body: slot(M.notice("error", t("approval.failed"), { sub: t("approval.failed.hint"), btn: { label: t("action.retry"), icon: "refresh-cw", primary: true }, support: true })) +
          heading() + summary() + flagged({ all: true, checked: true }) + changesCard(),
        bar: bar("fix")
      };
    },
    offline: function () {
      return {
        pills: { engine: "off", claude: "unchecked", host: "unlinked" },
        body: slot(M.offline()) +
          heading() + summary({ disabled: true }) + flagged({ all: true, checked: true }) + changesCard({ disabled: true }),
        bar: bar("off")
      };
    },
    "no-claude-signed-out": function () { return noClaude(false); },
    "no-claude-missing": function () { return noClaude(true); },
    stale: function () {
      return {
        body: slot(prevNotice("info", t("notice.plan_changed"), D.previous_approval.plan_changed, t("demo.diff"))) +
          heading() + summary({ text: "demo.summary2", plan: D.plan2, reel: "demo.reel2" }) + flagged({ all: true, prev: D.previous_approval.plan_changed }) + changesCard(),
        bar: bar("needwho")
      };
    },
    "success-live": function () {
      return {
        needs: 0,
        body: slot(M.notice("ok", t("approval.done_live"))) +
          M.steps(["done", "done", "done", "run", "pend", "pend", "pend"], 3, "busy") + doneRecord() + summary()
      };
    },
    "success-later": function () {
      return {
        needs: 1,
        body: M.notice("ok", t("approval.done"), { sub: t("approval.claude_later") }) +
          '<div class="m-col mt-3">' + M.btn(t("action.open_claude"), { kind: "primary", block: true, icon: "external-link", kbd: true }) + '</div>' +
          '<div class="mt-4"></div>' +
          M.steps(["done", "done", "done", "wait", "pend", "pend", "pend"], 3, "pending") + doneRecord() + summary()
      };
    },
    "success-changes": function () {
      return {
        needs: 0,
        body: slot(M.notice("ok", t("notice.changes"), { sub: t("approval.changes_next") })) +
          M.steps(["done", "run", "pend", "pend", "pend", "pend", "pend"], 1, "busy") +
          M.card('<div class="m-row"><div class="t-label m-grow">' + t("approval.changes.label") + '</div>' +
            M.chip("ok", t("approval.sent"), "circle-check") + '</div>' +
            '<div class="m-inset mt-2"><div class="t-body">' + t("demo.changes") + '</div></div>', "mt-4")
      };
    },
    long: function () { return { body: heading() + summary() + flagged({ all: true, checked: true }) + changesCard(), bar: bar("ok") }; }
  };

  M.mount({
    id: "P-07", name: "Approval",
    states: ["empty", "loading", "normal", "older", "noname", "flagged-unchecked", "flagged-checked", "domains", "domains-checked", "removed", "focus", "error", "error-live", "offline", "no-claude-signed-out", "no-claude-missing", "stale", "success-live", "success-later", "success-changes", "long"],
    defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      v.tab = "edit";
      if (v.needs === undefined) v.needs = 1;
      return v;
    }
  });
})();
</script>
</body>
</html>
