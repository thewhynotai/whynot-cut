<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mock-states" content="loading,normal,normal-live,cost-open,focus,error,error-live,offline,no-claude-signed-out,no-claude-missing,stale,success,long">
<meta name="mock-keys" content="Mod+Enter = the screen's one primary (Set up my first client, or the red row's fix); Esc = close the top notice; no single-key shortcuts (Premiere owns them). Tabs are hidden during setup, so Alt+1/2/3 does nothing here. UXP keydown capture: lab item.">
<meta name="mock-motion" content="trigger | property | token | final static state
row turns green | icon fill, detail colour | --mk-dur-base, --mk-ease | ok icon + white detail;
setup bar segment fills | background-color | --mk-dur-slow, --mk-ease | done segment #9D6BFF;
checking spinner | transform rotate (loop) | 900 ms linear | static circle-dashed icon when animations do not run;
button hover / press / focus | background-color, border-color | --mk-dur-fast, --mk-ease | rest fill, 2 px border (focus: white on violet);
notice in (stale, ready) | background-color, border-color | --mk-dur-base | notice in its reserved slot, no layout shift">
<title>P-01 First-run checklist</title>
<link rel="stylesheet" href="../mockup.css">
<script src="../icons.js"></script>
<script src="../strings.js"></script>
<script src="../mockup.js"></script>
</head>
<body>
<script>
/* P-01 First-run checklist (screen-inventory.md §3 P-01; E-D3 r1, Addendum G r1 and R2 fixes).
   R2: one status model (a signed-out Claude is AMBER in the row, the step bar and the pill; only "not installed" is red,
   designer P1-3); the no-Claude card is one sentence + one button + a "What Claude sees" link, the account, cost and
   privacy lines show only on the healthy row (designer P1-12); under a restart notice the main action is off (shell
   stalePass, P1-1); success says "You're ready" and offers "Go to Home" (P1-8).
   - "3 of 4 ready" with a 4-segment bar under the intro.
   - The background program is "the WhyNot Cut service", explained once on its row; Claude is introduced once on its row,
     with the cost (D-01: each editor's own Claude Pro or Max plan, paid to Anthropic, "See plans" to support.claude.com),
     where the footage goes (D-03), what happens to the data at Anthropic (D-02) and, only when live, "Cost and data".
   - Support (D-05 update 2026-10-16): the WhatsApp chat is live, so the support action is "Copy details and open WhatsApp"
     (one action) with the D-05 reply promise in every state (?support=off draws the alternate copy-only state). H24 still
     gates "Cost and data" (thewhynot.ai/data): it shows only in normal-live / error-live.
   - R3 (designer F-06, editor P1-06c): the healthy Claude row is "Signed in" + one cost line + See plans / What Claude
     sees / "Cost and privacy". The approved D-01, D-03 and D-02 lines (words unchanged) sit behind "Cost and privacy"
     (cost-open, and normal-live with "Cost and data"), so "Set up my first client" is inside the first screen at 360.
   - R3 (designer F-01, owner N-13, editor P2-01): while setup has steps open the header says "Setting up · 3 of 4",
     never "All set"; in stale "Try the sample clip" is off too (F-20: it needs Premiere).
   - A row's fix sits under its sentence with a one-line hint; the first red row's fix is the one primary.
   - no-claude-signed-out / no-claude-missing: the Claude row turns red and its fix is the primary.
   - When the service, the link and Claude are green: "Set up my first client" (primary) + "Try the sample clip".
   - The Needs-you badge is hidden during setup; the header status collapses to "All set" when everything is ok. */
(function () {
  var t = M.t, D = M.D;

  function row(kind, label, o) {
    o = o || {};
    return '<div class="m-check">' + M.status(kind) +
      '<div class="m-check-text"><div class="t-label">' + label + '</div>' +
      (o.explain ? '<div class="t-meta tx-muted">' + o.explain + '</div>' : '') +
      (o.account ? '<div class="t-meta tx-muted mt-1">' + o.account + '</div>' + M.plansLink() : '') +
      (o.privacy ? '<div class="m-saved mt-1">' + M.ico("lock", 16, "ink-muted") + '<div class="m-col ms-2 m-grow"><div class="t-meta tx-muted">' + o.privacy + '</div>' +
        '<div class="t-meta tx-muted mt-1">' + t("privacy.extra") + '</div>' +
        '<div class="t-meta tx-muted mt-1">' + t("claude.data") + '</div>' + M.dataLink() + '</div></div>' : '') +
      '<div class="t-meta ' + (kind === "error" ? "tx-text" : "tx-muted") + (o.explain ? " mt-1" : "") + '">' + o.detail + '</div>' +
      (o.act ? '<div class="m-row mt-2">' + o.act + '</div>' : '') +
      (o.hint ? '<div class="t-meta tx-muted mt-2">' + o.hint + '</div>' : '') +
      (o.under || '') + '</div></div>';
  }
  function serviceRow(kind, detail, o) {
    o = o || {}; o.explain = t("checklist.engine.explain"); o.detail = detail;
    return row(kind, t("checklist.engine"), o);
  }
  function claudeRow(kind, detail, o) {
    o = o || {}; o.detail = detail;
    if (kind === "error" || kind === "warn") {
      /* needs the person: one sentence, one button, one link; the facts live behind the link */
      o.under = '<div class="m-row mt-1">' + M.linkbtn(t("privacy.link"), "info") + '</div>';
      return row(kind, t("checklist.claude"), o);
    }
    if (kind !== "ok") { o.explain = t("checklist.claude.explain"); return row(kind, t("checklist.claude"), o); }
    /* healthy: "Signed in" + one cost line + the links; the approved D-01 / D-03 / D-02 lines behind "Cost and privacy" */
    var open = !!o.open;
    var links = '<div class="m-row m-wrap mt-1">' +
      '<div class="m-linkcell">' + M.linkbtn(t("plans.link"), "external-link") + '</div>' +
      '<div class="m-linkcell">' + M.linkbtn(t("privacy.link"), "info") + '</div>' +
      '<div class="m-linkcell">' + M.linkbtn(t(open ? "firstrun.cost.less" : "firstrun.cost.more"), open ? "chevron-up" : "chevron-down") + '</div></div>';
    var more = !open ? '' :
      '<div class="m-inset mt-2"><div class="t-meta tx-muted">' + t("claude.cost") + '</div>' +
      '<div class="m-saved mt-2">' + M.ico("lock", 16, "ink-muted") + '<div class="m-col ms-2 m-grow"><div class="t-meta tx-muted">' + t("privacy.claude_sees") + '</div>' +
        '<div class="t-meta tx-muted mt-1">' + t("privacy.extra") + '</div>' +
        '<div class="t-meta tx-muted mt-1">' + t("claude.data") + '</div>' + M.dataLink() + '</div></div></div>';
    return '<div class="m-check">' + M.status("ok") +
      '<div class="m-check-text"><div class="t-label">' + t("checklist.claude") + '</div>' +
      '<div class="t-meta tx-muted">' + detail + '</div>' +
      '<div class="t-meta tx-muted mt-1">' + t("claude.cost.short") + '</div>' + links + more + '</div></div>';
  }
  function primaryBtn(label, icon, focus) { return M.btn(label, { kind: "primary", icon: icon, focus: focus, kbd: true }); }
  function clientPrimary(focus) {
    return '<div class="m-col mt-3">' + M.btn(t("firstrun.client"), { kind: "primary", block: true, icon: "folder-input", focus: focus, kbd: true }) +
      '<div class="t-meta tx-muted mt-2">' + t("firstrun.client_hint") + '</div>' +
      '<div class="m-col mt-3">' + M.btn(t("firstrun.sample"), { kind: "secondary", block: true, icon: "play", cls: "m-needs-host" }) + '</div>' +
      '<div class="t-meta tx-muted mt-2">' + t("firstrun.sample_hint") + '</div></div>';
  }
  function intro(done, kind, extra, finished) {
    return '<div class="t-title">' + t(finished ? "firstrun.done.title" : "firstrun.title") + '</div>' +
      '<div class="t-body tx-muted mt-1">' + t(finished ? "firstrun.done.sub" : "firstrun.sub") + '</div>' + (extra || '') +
      '<div class="mt-4">' + M.segbar(4, done, t("firstrun.progress", { n: done, of: 4 }), kind) + '</div>';
  }
  function report() {
    /* one support action (H24): copy only while the page is not live, copy and open when it is; the reply promise shows when live */
    return '<div class="mt-3">' + M.supportRow({ flush: true, promise: true }) + '</div>';
  }
  function threeGreenRows(focus, open) {
    return serviceRow("ok", t("checklist.engine.ok")) +
      row("ok", t("checklist.premiere"), { detail: t("checklist.premiere.ok") }) +
      claudeRow("ok", t("checklist.claude.ok"), { open: open }) +
      row("pending", t("checklist.clients"), { detail: t("checklist.clients.none"), under: clientPrimary(focus) });
  }
  function noClaude(missing) {
    return {
      pills: { claude: missing ? "missing" : "signed_out" },
      body: intro(2, missing ? "error" : "warn") + M.card(
        serviceRow("ok", t("checklist.engine.ok")) +
        row("ok", t("checklist.premiere"), { detail: t("checklist.premiere.ok") }) +
        claudeRow(missing ? "error" : "warn", t(missing ? "claude.missing" : "claude.signed_out"), {
          act: primaryBtn(t(missing ? "action.install_guide" : "action.sign_in"), missing ? "external-link" : "log-in"),
          hint: t(missing ? "claude.missing.hint" : "claude.signed_out.hint") }) +
        row("pending", t("checklist.clients"), { detail: t("firstrun.waiting_claude") }), "m-card-flush mt-4") +
        '<div class="m-row mt-3">' + M.btn(t("action.check_again"), { kind: "ghost", icon: "refresh-cw", flush: true }) + '</div>'
    };
  }

  var STATES = {
    loading: function () {
      return {
        pills: { engine: "starting", claude: "unchecked", host: "checking" },
        body: intro(0, "busy", '<div class="m-row mt-4">' + M.status("busy") + '<div class="t-body ms-2">' + t("firstrun.starting") + '</div></div>') +
          M.card(serviceRow("pending", t("status.pending")) +
            row("pending", t("checklist.premiere"), { detail: t("status.pending") }) +
            claudeRow("pending", t("status.pending")) +
            row("pending", t("checklist.clients"), { detail: t("status.pending") }), "m-card-flush mt-3")
      };
    },
    normal: function () { return { body: intro(3) + M.card(threeGreenRows(false, M.live), "m-card-flush mt-4") }; },
    "cost-open": function () { return { body: intro(3) + M.card(threeGreenRows(false, true), "m-card-flush mt-4") }; },
    focus: function () { return { body: intro(3) + M.card(threeGreenRows(true), "m-card-flush mt-4") }; },
    error: function () {
      return {
        pills: { host: "unlinked" },
        body: intro(2, "error") + M.card(
          serviceRow("ok", t("checklist.engine.ok")) +
          row("error", t("checklist.premiere"), { detail: t("link.off"), act: primaryBtn(t("action.retry"), "refresh-cw"), hint: t("retry.hint") }) +
          claudeRow("ok", t("checklist.claude.ok")) +
          row("pending", t("checklist.clients"), { detail: t("firstrun.waiting_link") }), "m-card-flush mt-4") + report()
      };
    },
    offline: function () {
      return {
        pills: { engine: "off", claude: "unchecked", host: "unlinked" },
        body: intro(0, "error") + M.card(
          serviceRow("error", t("engine.off"), { act: primaryBtn(t("action.start_app"), "power"), hint: t("engine.off.hint") }) +
          row("pending", t("checklist.premiere"), { detail: t("firstrun.waiting_engine") }) +
          claudeRow("pending", t("firstrun.waiting_engine")) +
          row("pending", t("checklist.clients"), { detail: t("firstrun.waiting_engine") }), "m-card-flush mt-4") + report()
      };
    },
    "no-claude-signed-out": function () { return noClaude(false); },
    "no-claude-missing": function () { return noClaude(true); },
    stale: function () {
      return {
        body: M.slot(M.stale()) + intro(3) + M.card(threeGreenRows(false), "m-card-flush mt-4")
      };
    },
    success: function () {
      return {
        body: intro(4, "ok", "", true) + M.card(
          serviceRow("ok", t("checklist.engine.ok")) +
          row("ok", t("checklist.premiere"), { detail: t("checklist.premiere.ok") }) +
          claudeRow("ok", t("checklist.claude.ok")) +
          row("ok", t("checklist.clients"), { detail: t("checklist.clients.ok", { client: D.client }) }), "m-card-flush mt-4") +
          '<div class="m-col mt-4">' + M.btn(t("firstrun.go_home"), { kind: "primary", block: true, icon: "circle-check-big", kbd: true }) +
          '<div class="mt-2"></div>' + M.btn(t("firstrun.sample"), { kind: "secondary", block: true, icon: "play" }) + '</div>' +
          '<div class="t-meta tx-muted mt-2">' + t("firstrun.sample_hint") + '</div>'
      };
    },
    long: function () { return STATES.success(); }
  };

  M.mount({
    id: "P-01", name: "First-run checklist",
    states: ["loading", "normal", "normal-live", "cost-open", "focus", "error", "error-live", "offline", "no-claude-signed-out", "no-claude-missing", "stale", "success", "long"],
    defaultState: "normal",
    build: function (state) {
      var v = STATES[state]();
      /* setup progress for the header: "Setting up · 3 of 4" while a step is open (R3 F-01) */
      var done = { loading: 0, offline: 0, error: 2, "no-claude-signed-out": 2, "no-claude-missing": 2, success: 4, long: 4 }[state];
      v.noclient = true; v.setup = { done: done === undefined ? 3 : done, of: 4 }; v.tab = null;
      return v;
    }
  });
})();
</script>
</body>
</html>
