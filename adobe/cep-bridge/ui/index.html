<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>WhyNot Cut</title>
<!-- tokens.css is brand/tokens.css, copied as-is into the bundle by cep_bundle.assemble (the one token source) -->
<link rel="stylesheet" href="tokens.css">
<style>
 body{margin:0;padding:12px;background:var(--twn-bg);color:var(--twn-text);font:400 12px/1.45 var(--twn-font-ui)}
 header{padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid transparent;
        border-image:var(--twn-gradient) 1}
 h1{margin:0;font:700 14px/1.2 var(--twn-font-display);color:var(--twn-text)}
 .by{margin-top:2px;font-size:10px;color:var(--twn-text-muted)}
 #state{margin:0 0 12px}
 button{font:600 12px/1 var(--twn-font-ui);color:var(--twn-text);background:var(--twn-glass);
        border:1px solid var(--twn-border);border-radius:var(--twn-radius-control);padding:9px 14px;cursor:pointer}
 button:hover{border-color:var(--twn-primary-text)}
 button:focus-visible{outline:none;box-shadow:var(--twn-focus)}
</style></head>
<body>
<header><h1>WhyNot Cut</h1><div class="by">by The Why Not AI</div></header>
<p id="state" role="status" aria-live="polite">Starting WhyNot Cut&hellip;</p>
<button id="copy" type="button">Copy diagnostics</button>
<!-- the After Effects panel: js/bridge.js in its panel role only reads the daemon's state (it never works the queue
     and never starts anything); js/panel.js shows it -->
<script src="../js/bridge.js"></script>
<script src="js/panel.js"></script>
</body></html>
