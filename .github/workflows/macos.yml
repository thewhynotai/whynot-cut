# WhyNot Cut 3.0 on macOS (Apple silicon), G-T13. What runs when, the minutes budget and how to read a run: docs/ci.md.
#   smoke  every push to release/3.0 or mac/dev (the agency Mac's branch; not docs-only pushes), or by hand: shell checks + a fast unit subset (~5 min)
#   full   tags v3.0.0-* (phase tags, release candidates), or by hand with suite=full: the whole suite
# macOS minutes count x10 against the free 2,000 a month: check with `bash tools/ci/minutes.sh` at every phase close.
# Zero cost (Addendum F): GitHub-hosted runners only, no secrets, only actions/* pinned by full commit SHA.
name: macOS

on:
  push:
    branches: [release/3.0, mac/dev]
    tags: ["v3.0.0-*"]
    paths-ignore:            # branch pushes only (GitHub does not apply path filters to tag pushes)
      - "PROGRESS.md"
      - "docs/superpowers/**"
      - "docs/design/**"
      - "docs/ci.md"
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke (~5 min, ~60 billed) or full (whole suite, ~60 min, ~600 billed)"
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

# A newer push to the same ref cancels the older run (tags and the branch are different refs, so a phase tag's full
# run is never cancelled by the branch push that came with it).
concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  smoke:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whynot-cut/setup/locks/runtime-mac-arm64.lock

      - name: Use Apple's bash 3.2 as `bash` (what a tester's Mac runs the installer with)
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      - name: Cache the pinned ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.whynot-cut/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('whynot-cut/setup/components.json') }}

      - name: Engine venv (smoke packages) + pinned ffmpeg
        timeout-minutes: 5
        run: |
          echo "bash $BASH_VERSION at $(command -v bash)"
          bash tools/ci/setup_engine.sh smoke

      - name: Shell checks (bash -n with bash 3.2, install.sh --dry-run in a sandbox HOME)
        timeout-minutes: 3
        run: bash tools/ci/smoke.sh shell

      - name: Unit subset
        timeout-minutes: 8
        run: bash tools/ci/smoke.sh tests

  full:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: macos-14
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whynot-cut/setup/locks/runtime-mac-arm64.lock

      - name: Use Apple's bash 3.2 as `bash` (what a tester's Mac runs the installer with)
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      - name: Cache the pinned ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.whynot-cut/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('whynot-cut/setup/components.json') }}

      - name: Engine venv (the whole runtime lock) + pinned ffmpeg
        timeout-minutes: 8
        run: |
          echo "bash $BASH_VERSION at $(command -v bash)"
          bash tools/ci/setup_engine.sh full

      - name: Shell checks (bash -n with bash 3.2, install.sh --dry-run in a sandbox HOME)
        timeout-minutes: 3
        run: bash tools/ci/smoke.sh shell

      - name: Whole suite (tools/test.sh)
        timeout-minutes: 90
        run: bash tools/test.sh
